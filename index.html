<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplier Ledger — Supplier &amp; Inventory Manager</title>
<style>
  :root{
    --ink:#142023;
    --ink-soft:#3c4d51;
    --paper:#E9EDEE;
    --paper-raised:#F6F8F8;
    --line:#c7d0d1;
    --accent:#2F6F72;
    --accent-soft:#DCE9E9;
    --amber:#C98A2B;
    --amber-soft:#F3E4C8;
    --rust:#A64B3B;
    --rust-soft:#F1DCD7;
    --green:#3a6b26;
    --green-soft:#DEEED2;
    --radius:3px;
    --shadow:0 1px 2px rgba(20,32,35,.08), 0 4px 14px rgba(20,32,35,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.45;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:var(--accent);}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---- Shell ---- */
  #shell{display:flex;min-height:100vh;}
  #sidebar{
    width:210px;flex:none;background:var(--ink);color:var(--paper-raised);
    padding:18px 0;display:flex;flex-direction:column;
  }
  #sidebar .brand{padding:0 18px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px;}
  #sidebar .brand .mark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:-0.02em;}
  #sidebar .brand .sub{font-family:'IBM Plex Mono',monospace;font-size:9.5px;opacity:.55;letter-spacing:.06em;text-transform:uppercase;margin-top:3px;}
  #sidebar .brand .version{font-family:'IBM Plex Mono',monospace;font-size:9px;opacity:.4;letter-spacing:.04em;margin-top:5px;display:inline-block;border:1px solid rgba(255,255,255,.2);padding:1px 5px;border-radius:3px;}
  .nav-item{
    display:flex;align-items:center;padding:10px 18px;color:rgba(233,237,238,.75);
    cursor:pointer;font-size:13px;border-left:3px solid transparent;transition:.12s;
    white-space:nowrap;
  }
  .nav-item .num{font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:.5;width:24px;flex:none;display:inline-block;}
  .nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--amber);}
  .nav-suppliers{margin-top:6px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12);flex:1;overflow-y:auto;}
  .nav-suppliers .heading{padding:4px 18px 6px;font-family:'IBM Plex Mono',monospace;font-size:10px;opacity:.5;text-transform:uppercase;letter-spacing:.07em;}
  .sup-nav-item{padding:8px 18px;font-size:13px;color:rgba(233,237,238,.7);cursor:pointer;border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sup-nav-item:hover{color:#fff;background:rgba(255,255,255,.05);}
  .sup-nav-item.active{color:#fff;background:rgba(255,255,255,.08);border-left-color:var(--amber);}
  #sidebar .bottom{padding:12px 18px 0;border-top:1px solid rgba(255,255,255,.12);margin-top:10px;}
  #sidebar .bottom button{width:100%;background:transparent;border:1px solid rgba(255,255,255,.25);color:rgba(233,237,238,.8);padding:7px;border-radius:var(--radius);font-size:11.5px;margin-bottom:6px;}
  #sidebar .bottom button:hover{border-color:#fff;color:#fff;}

  #main{flex:1;padding:32px 40px 60px;max-width:1440px;min-width:0;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:20px;flex-wrap:wrap;}
  .page-head h1{font-size:24px;margin:0 0 4px;}
  .page-head .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);}
  .actions{display:flex;gap:8px;flex-wrap:wrap;}

  .btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper-raised);padding:8px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;}
  .btn:hover{background:#24393e;}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--ink);}
  .btn.accent{background:var(--accent);border-color:var(--accent);}
  .btn.accent:hover{background:#255a5c;}
  .btn.rust{background:var(--rust);border-color:var(--rust);}
  .btn.rust:hover{background:#8a3d30;}
  .btn.sm{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  #main > .card + .card{margin-top:18px;}
  .card .card-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .card .card-head h3{margin:0;font-size:15px;}
  .card-body{padding:18px;}

  .grid{display:grid;gap:16px;}
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));align-items:stretch;}
  .grid.cols-4{grid-template-columns:2fr 2fr 1.4fr 1fr;}
  .grid.cols-5{grid-template-columns:1.6fr 1.2fr 1fr 1fr 1fr;}
  .grid > .card{margin-top:0 !important;}
  @media(max-width:800px){.grid.cols-2,.grid.cols-3,.grid.cols-4,.grid.cols-5{grid-template-columns:1fr;}}

  label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:4px;font-weight:500;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink);font-size:13.5px;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
  .field{margin-bottom:14px;}

  .table-wrap{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scroll-behavior:smooth;
    scrollbar-width:thin;
    scrollbar-color:var(--accent) var(--line);
    cursor:grab;
    position:relative;
  }
  .table-wrap.grabbing{
    cursor:grabbing;
    user-select:none;
  }
  .table-wrap::-webkit-scrollbar{
    height:9px;
  }
  .table-wrap::-webkit-scrollbar-track{
    background:var(--line);
    border-radius:4px;
  }
  .table-wrap::-webkit-scrollbar-thumb{
    background:var(--accent);
    border-radius:4px;
  }
  .table-wrap::-webkit-scrollbar-thumb:hover{
    background:#1f4c4e;
  }

  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
  thead th{
    text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-soft);border-bottom:1.5px solid var(--ink);padding:8px 10px;white-space:nowrap;
    position:sticky;top:0;background:var(--paper-raised);z-index:5;
  }
  tbody td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:var(--accent-soft);}
  td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .entry-no{font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:11.5px;}

  /* Sticky Left Columns for Slideable Tables */
  #stock-table{min-width:1150px;}
  #stock-table thead th:nth-child(1){
    position:sticky;left:0;z-index:7;background:var(--paper-raised);width:34px;min-width:34px;
  }
  #stock-table thead th:nth-child(2){
    position:sticky;left:34px;z-index:7;background:var(--paper-raised);min-width:170px;
    box-shadow:3px 0 6px -2px rgba(0,0,0,0.12);
  }
  #stock-table tbody td:nth-child(1){
    position:sticky;left:0;z-index:4;background:var(--paper-raised);width:34px;min-width:34px;
  }
  #stock-table tbody td:nth-child(2){
    position:sticky;left:34px;z-index:4;background:var(--paper-raised);min-width:170px;font-weight:500;
    box-shadow:3px 0 6px -2px rgba(0,0,0,0.12);
  }
  #stock-table tbody tr:hover td:nth-child(1),
  #stock-table tbody tr:hover td:nth-child(2){
    background:var(--accent-soft);
  }
  #stock-table tr.cat-header td{
    position:sticky;left:0;z-index:5;
  }

  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
  .tag.arrived{background:var(--accent-soft);color:#1f4c4e;}
  .tag.pending{background:var(--rust-soft);color:#7a3327;}
  .tag.partial{background:var(--amber-soft);color:#7a5416;}
  .tag.return{background:var(--rust-soft);color:#7a3327;}
  .tag.faulty{background:var(--amber-soft);color:#7a5416;}
  .tag.adjusted{background:var(--amber-soft);color:#7a5416;}

  .catbadge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .cat-header td{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;padding:7px 12px;letter-spacing:.02em;}
  .swatch{width:26px;height:26px;border-radius:4px;display:inline-block;cursor:pointer;border:2px solid transparent;vertical-align:middle;transition:.12s;}
  .swatch.active{border-color:var(--ink);}
  .swatch-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}

  .tick{width:18px;height:18px;border:1.5px solid var(--ink-soft);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;flex:none;}
  .tick.checked{background:var(--accent);border-color:var(--accent);color:#fff;font-size:12px;}

  .empty{padding:40px 20px;text-align:center;color:var(--ink-soft);}
  .empty .big{font-family:'Space Grotesk',sans-serif;font-size:16px;color:var(--ink);margin-bottom:6px;}

  .line-items-table{
    min-width:1380px;
    border-collapse:separate;
    border-spacing:0;
  }
  .line-items-table th, .line-items-table td{
    white-space:nowrap;
    padding:6px 8px;
  }
  .line-items-table input, .line-items-table select{
    padding:6px 8px;
    font-size:13px;
  }
  .line-items-table th.qty-col, .line-items-table td.qty-col{width:68px;min-width:68px;text-align:center;}
  .line-items-table input.qty-input{
    width:58px;min-width:58px;text-align:center;font-family:'IBM Plex Mono',monospace;
    font-weight:700;font-size:14px;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);padding:5px 4px;color:var(--ink);
  }
  .line-items-table input.qty-input:focus{border-color:var(--accent);outline:2px solid var(--accent-soft);}

  .col-cat{ width:140px; min-width:140px; }
  .col-prod{ width:280px; min-width:280px; }
  .col-store{ width:130px; min-width:130px; }
  .col-supname{ width:180px; min-width:180px; }
  .col-code{ width:120px; min-width:120px; }
  .col-ean{ width:130px; min-width:130px; }
  .col-colour{ width:110px; min-width:110px; }
  .col-cost{ width:95px; min-width:95px; }
  .col-total{ width:105px; min-width:105px; }
  .col-actions{ width:130px; min-width:130px; }

  /* Sticky Category & Product in line-items-table */
  .line-items-table thead th.col-cat{
    position:sticky;left:0;z-index:7;background:var(--paper-raised);
  }
  .line-items-table thead th.col-prod{
    position:sticky;left:140px;z-index:7;background:var(--paper-raised);
    box-shadow:3px 0 6px -2px rgba(0,0,0,0.12);
  }
  .line-items-table tbody td.col-cat{
    position:sticky;left:0;z-index:4;background:var(--paper-raised);
  }
  .line-items-table tbody td.col-prod{
    position:sticky;left:140px;z-index:4;background:var(--paper-raised);
    box-shadow:3px 0 6px -2px rgba(0,0,0,0.12);
  }
  .line-items-table tbody tr:hover td.col-cat,
  .line-items-table tbody tr:hover td.col-prod{
    background:var(--accent-soft);
  }
  .line-items-table tr.cat-header td, #stock-table tr.cat-header td{
    position:sticky;left:0;z-index:5;
  }

  .cellinput{border:1px solid transparent;background:transparent;width:100%;}
  .cellinput:hover{border-color:var(--line);}
  .cellinput:focus{border-color:var(--accent);background:#fff;}
  .icon-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:2px 5px;color:var(--ink-soft);}
  .icon-btn:hover{color:var(--ink);}
  .icon-btn.rust-ic{color:var(--rust);}
  .icon-btn.rust-ic:hover{color:#7a3327;}
  .icon-btn:disabled{opacity:.25;cursor:not-allowed;}
  .actions-cell{white-space:nowrap;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
  .toolbar .field{margin-bottom:0;min-width:160px;}
  .toolbar .field.grow{flex:1;min-width:220px;}

  .supplier-card{
    padding:16px 18px;cursor:pointer;transition:.12s;
    display:flex;flex-direction:column;justify-content:space-between;
    min-height:125px;margin-top:0 !important;background:var(--paper-raised);
  }
  .supplier-card:hover{border-color:var(--accent);box-shadow:var(--shadow);}
  .supplier-card h3{margin:0 0 4px;font-size:16px;}
  .supplier-card .stats{display:flex;gap:16px;margin-top:auto;padding-top:10px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);}
  .supplier-card .stats b{color:var(--ink);font-size:13px;display:block;font-family:'Space Grotesk',sans-serif;}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--radius);font-size:13px;box-shadow:var(--shadow);z-index:999;opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none;max-width:360px;}
  .toast.show{opacity:1;transform:translateY(0);}

  .modal-bg{position:fixed;inset:0;background:rgba(20,32,35,.5);display:flex;align-items:center;justify-content:center;z-index:900;padding:20px;overflow-y:auto;}
  .modal{background:var(--paper-raised);border-radius:var(--radius);width:100%;max-width:460px;box-shadow:var(--shadow);margin:auto;position:relative;}
  .modal.modal-lg{max-width:960px;}
  .modal-close-btn{
    position:absolute;top:12px;right:14px;background:none;border:none;font-size:18px;line-height:1;
    color:var(--ink-soft);cursor:pointer;font-weight:700;z-index:20;padding:3px 7px;border-radius:3px;
    transition:background .15s;
  }
  .modal-close-btn:hover{color:var(--ink);background:rgba(0,0,0,0.07);}
  .modal .card-head{padding:16px 20px 14px 20px;}
  .modal .card-body{padding:20px;}
  .modal .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

  .divider-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);}
  .muted{color:var(--ink-soft);}
  .small{font-size:12px;}
  .order-detail{background:var(--paper);}
  .sortbar{display:flex;gap:6px;}
  .sortbar button{border:1px solid var(--line);background:#fff;padding:6px 10px;font-size:12px;border-radius:var(--radius);}
  .sortbar button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .mover-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .mover-row:last-child{border-bottom:none;}
  .mover-row b{font-family:'IBM Plex Mono',monospace;color:var(--rust);}
  #lock-screen{position:fixed;inset:0;background:var(--paper);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
  .grid.cols-3{grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));}
  .md-layout{display:flex;gap:16px;align-items:flex-start;}
  .md-list{width:300px;flex:none;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);overflow-y:auto;max-height:640px;}
  .md-list-row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px;}
  .md-list-row:last-child{border-bottom:none;}
  .md-list-row:hover{background:var(--accent-soft);}
  .md-list-row.active{background:var(--ink);color:#fff;}
  .md-list-row .row-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;}
  .md-list-row .row-sub{color:var(--ink-soft);font-size:11px;margin-top:4px;}
  .md-list-row.active .row-sub{color:rgba(255,255,255,.75);}
  .md-list-row.active .tag.arrived{background:#3a6b26;color:#fff;}
  .md-list-row.active .tag.pending{background:#A64B3B;color:#fff;}
  .md-list-row.active .tag.partial{background:#C98A2B;color:#fff;}
  .md-list-row.active .tag.return{background:#A64B3B;color:#fff;}
  .md-list-row.active .tag.faulty{background:#C98A2B;color:#fff;}
  .md-detail{flex:1;min-width:0;}
  @media(max-width:900px){.md-layout{flex-direction:column;} .md-list{width:100%;max-height:260px;}}

  /* Stock Required tags & tables */
  .tag.urgent{background:#fce8e6;color:#c5221f;border:1px solid #f6aea9;font-weight:700;}
  .tag.normal-prio{background:#e8f0fe;color:#1967d2;border:1px solid #aecbfa;}
  .tag.low-prio{background:#f1f3f4;color:#5f6368;border:1px solid #dadce0;}

  .req-table, #req-table{min-width:1480px;border-collapse:separate;border-spacing:0;}
  .req-table th, .req-table td, #req-table th, #req-table td{white-space:nowrap;padding:5px 6px;}
  .req-table thead tr:first-child th:nth-child(1), #req-table thead tr:first-child th:nth-child(1){position:sticky;left:0;z-index:8;background:var(--paper-raised);width:34px;min-width:34px;text-align:center;}
  .req-table thead tr:first-child th:nth-child(2), #req-table thead tr:first-child th:nth-child(2){position:sticky;left:34px;z-index:8;background:var(--paper-raised);min-width:85px;}
  .req-table thead tr:first-child th:nth-child(3), #req-table thead tr:first-child th:nth-child(3){position:sticky;left:119px;z-index:8;background:var(--paper-raised);width:125px;min-width:125px;}
  .req-table thead tr:first-child th:nth-child(4), #req-table thead tr:first-child th:nth-child(4){position:sticky;left:244px;z-index:8;background:var(--paper-raised);min-width:240px;box-shadow:3px 0 6px -2px rgba(0,0,0,0.12);}
  .req-table tbody td:nth-child(1), #req-table tbody td:nth-child(1){position:sticky;left:0;z-index:4;background:var(--paper-raised);width:34px;min-width:34px;text-align:center;}
  .req-table tbody td:nth-child(2), #req-table tbody td:nth-child(2){position:sticky;left:34px;z-index:4;background:var(--paper-raised);min-width:85px;}
  .req-table tbody td:nth-child(3), #req-table tbody td:nth-child(3){position:sticky;left:119px;z-index:4;background:var(--paper-raised);width:125px;min-width:125px;}
  .req-table tbody td:nth-child(4), #req-table tbody td:nth-child(4){position:sticky;left:244px;z-index:4;background:var(--paper-raised);min-width:240px;font-weight:600;box-shadow:3px 0 6px -2px rgba(0,0,0,0.12);}
  .req-table tbody tr:hover td:nth-child(1),
  .req-table tbody tr:hover td:nth-child(2),
  .req-table tbody tr:hover td:nth-child(3),
  .req-table tbody tr:hover td:nth-child(4){background:var(--accent-soft);}
  .req-table tr.cat-header td{position:sticky;left:0;z-index:5;}



  /* Master Category & Supplier Table Comparison Styles (v2.1) */
  .comp-page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:16px;flex-wrap:wrap;}

  .comp-toolbar{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);}
  .comp-search-wrap{flex:1;min-width:240px;position:relative;display:flex;align-items:center;}
  .comp-search-wrap input{width:100%;padding:7px 12px 7px 32px;font-size:13.5px;border-radius:var(--radius);border:1px solid var(--line);background:#fff;}
  .comp-search-icon{position:absolute;left:10px;color:var(--ink-soft);font-size:14px;}

  .comp-cat-section{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:24px;box-shadow:var(--shadow);overflow:hidden;}
  .comp-cat-header-bar{padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .comp-cat-title-wrap{display:flex;align-items:center;gap:10px;}
  .comp-cat-title-wrap h3{margin:0;font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-0.01em;}

<script>
/* =========================================================
   DATA LAYER
========================================================= */
const SEED_DB = {"suppliers":[],"categories":[],"stockRequired":[],"products":[],"colours":[],"orders":[],"categoryColours":{},"exportLog":[],"supplierCatalogs":{},"stores":[],"categoryColorColumns":{},"supplierPayments":[]};


function escapeHtml(str){
  if(str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

const DB_KEY = 'stockledger_db_v2'; // primary localStorage key
const BACKUP_KEY = 'stockledger_db_backup_latest'; // redundant backup key

// IndexedDB durable storage layer (persists across browser restarts and storage pressure)
const IDB_NAME = 'StockLedgerDB';
const IDB_STORE = 'app_state';
function openIDB(){
  return new Promise((resolve) => {
    if(typeof window === 'undefined' || !window.indexedDB){ resolve(null); return; }
    try{
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const idb = e.target.result;
        if(!idb.objectStoreNames.contains(IDB_STORE)){
          idb.createObjectStore(IDB_STORE);
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = () => {idb.close();resolve(null);};
    }catch(e){idb.close();resolve(null);}
  });
}

async function saveIDB(data){
  const snapshot = structuredClone(data), idb = await openIDB();
  if(!idb) return false;
  return new Promise(resolve => {
    try { const tx=idb.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(snapshot,'main_db');
      tx.oncomplete=()=>{idb.close();resolve(true)};
      tx.onerror=tx.onabort=()=>{idb.close();resolve(false)};
    } catch { idb.close();resolve(false); }
  });
}

async function loadIDB(){
  const idb = await openIDB();
  if(!idb) return null;
  return new Promise((resolve) => {
    try{
      const tx = idb.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get('main_db');
      req.onsuccess = () => {idb.close();resolve(req.result || null);};
      req.onerror = () => {idb.close();resolve(null);};
    }catch(e){idb.close();resolve(null);}
  });
}

async function initDurablePersistence(){
  try {
    const recovered=await loadIDB();
    if(recovered && StockSchema.valid(recovered) && (!loadedLocal || Number(recovered.meta?.savedAt||0)>Number(db.meta?.savedAt||0))) {
      db=StockSchema.normalise(recovered);storageNeedsRecovery=false;
    }
    if(storageNeedsRecovery){toast('Saved data is damaged. Existing copies are preserved; import a valid backup before editing.');return;}
    await saveDB();
  } catch { toast('Storage recovery could not finish. Export a backup before closing.'); }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function defaultDB(){
  return JSON.parse(JSON.stringify(SEED_DB));
}

let loadedLocal = false, storageNeedsRecovery = false;
let db = loadDB();

function loadDB(){
  for(const key of [DB_KEY,BACKUP_KEY]) {
    let raw=null;try { raw=localStorage.getItem(key);if(raw){const value=StockSchema.normalise(JSON.parse(raw));loadedLocal=true;storageNeedsRecovery=false;return value;} }
    catch(error){if(raw)storageNeedsRecovery=true;console.warn('A browser copy could not be read; trying recovery.');}
  }
  return defaultDB();
}

function saveDB(){
  if(storageNeedsRecovery){toast('Existing damaged copies are preserved. Restore a valid backup before saving.');return Promise.resolve(false);}
  db.meta={...db.meta,savedAt:Date.now()};
  let localSaved=false;
  const data=JSON.stringify(db);
  for(const key of [DB_KEY,BACKUP_KEY])try{localStorage.setItem(key,data);localSaved=true}catch{}
  return saveIDB(db).then(idbSaved=>{if(!localSaved&&!idbSaved)toast('Changes could not be saved. Download a backup before closing.');return localSaved||idbSaved;});
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 3200);
}

/* =========================================================
   SIMPLE PASSWORD LOCK
   Note: this is a basic screen-lock only, not real security —
   it lives entirely in this browser and can be bypassed by
   anyone who can read the page's code or local storage.
========================================================= */
const PASS_KEY = 'stockledger_pass_v1';
const SESSION_KEY = 'stockledger_unlocked';

function simpleHash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h<<5)+h) + str.charCodeAt(i); h |= 0; }
  return (h>>>0).toString(16);
}
function hasPassword(){ return !!localStorage.getItem(PASS_KEY); }
function checkPassword(pw){ return localStorage.getItem(PASS_KEY) === simpleHash(pw||''); }
function setPassword(pw){ localStorage.setItem(PASS_KEY, simpleHash(pw)); }
function clearPassword(){ localStorage.removeItem(PASS_KEY); }

async function boot(){
  await initDurablePersistence();
  const unlockedThisSession = sessionStorage.getItem(SESSION_KEY)==='1';
  if(unlockedThisSession){
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('shell').style.display = 'flex';
    render();
  } else {
    document.getElementById('shell').style.display = 'none';
    document.getElementById('lock-screen').style.display = 'flex';
    renderLockScreen();
  }
}
function unlockApp(){
  sessionStorage.setItem(SESSION_KEY, '1');
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('shell').style.display = 'flex';
  render();
}
function renderLockScreen(){
  const lockEl = document.getElementById('lock-screen');
  if(!hasPassword()){
    lockEl.innerHTML = `
      <div class="card" style="max-width:380px;width:100%;">
        <div class="card-head"><h3>Set a password</h3></div>
        <div class="card-body">
          <div class="small muted" style="margin-bottom:14px;">This is a simple screen-lock for this device — it keeps casual browsing out, but it isn't strong security (anyone with access to this file's code or browser storage could bypass it). Don't rely on it to protect highly sensitive information.</div>
          <div class="field"><label>Choose a password</label><input type="password" id="setup-pw" autofocus></div>
          <div class="field"><label>Confirm password</label><input type="password" id="setup-pw2"></div>
          <button class="btn" id="btn-setup-pw" style="width:100%;">Set password &amp; continue</button>
        </div>
      </div>`;
    const go = () => {
      const pw = document.getElementById('setup-pw').value;
      const pw2 = document.getElementById('setup-pw2').value;
      if(!pw || pw.length<4){ toast('Use at least 4 characters'); return; }
      if(pw!==pw2){ toast("Passwords don't match"); return; }
      setPassword(pw);
      unlockApp();
    };
    document.getElementById('btn-setup-pw').onclick = go;
    document.getElementById('setup-pw2').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  } else {
    lockEl.innerHTML = `
      <div class="card" style="max-width:380px;width:100%;">
        <div class="card-head"><h3>Supplier Ledger — locked</h3></div>
        <div class="card-body">
          <div class="field"><label>Password</label><input type="password" id="login-pw" autofocus></div>
          <button class="btn" id="btn-login" style="width:100%;">Unlock</button>
          <div class="small muted" style="margin-top:12px;text-align:center;"><a href="#" id="link-forgot">Forgot password? Reset it</a></div>
        </div>
      </div>`;
    const go = () => {
      const pw = document.getElementById('login-pw').value;
      if(checkPassword(pw)) unlockApp();
      else toast('Wrong password');
    };
    document.getElementById('btn-login').onclick = go;
    document.getElementById('login-pw').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    document.getElementById('link-forgot').onclick = (e) => {
      e.preventDefault();
      if(confirm("Reset the password lock? Your suppliers/orders data stays safe — only the password is cleared, and you'll set a new one.")){
        clearPassword();
        renderLockScreen();
      }
    };
  }
}

/* =========================================================
   HELPERS: catalog autocomplete lists
========================================================= */
function ensureCatalog(name, arr){
  const clean = (name||'').trim();
  if(!clean) return;
  if(!arr.some(x => x.toLowerCase() === clean.toLowerCase())) arr.push(clean);
}
function ensureProduct(name, category, code){
  const clean = (name||'').trim();
  if(!clean) return;
  const existing = db.products.find(p => p.name.toLowerCase() === clean.toLowerCase());
  if(!existing){
    db.products.push({ name: clean, category: category||'', code: code||'' });
  } else {
    if(category && !existing.category) existing.category = category;
    if(code && !existing.code) existing.code = code;
  }
}
function learnCatalogEntry(supplierId, item){
  const product = (item.product||'').trim();
  if(!supplierId || !product) return;
  if(!db.supplierCatalogs[supplierId]) db.supplierCatalogs[supplierId] = [];
  const cat = db.supplierCatalogs[supplierId];
  let entry = cat.find(c => c.product.toLowerCase() === product.toLowerCase());
  if(!entry){
    entry = { product, price: Number(item.cost)||0, code: item.code||'', ean: item.ean||'', supplierName: item.supplierName||'' };
    cat.push(entry);
  } else {
    if(item.cost) entry.price = Number(item.cost)||entry.price;
    if(item.code) entry.code = item.code;
    if(item.ean) entry.ean = item.ean;
    if(item.supplierName) entry.supplierName = item.supplierName;
  }
}
function findKnownProductDetails(query, supplierId){
  const clean = (query||'').trim().toLowerCase();
  if(!clean) return null;

  // 1. Search recent orders for this specific supplier first (newest orders first)
  if(supplierId){
    const supOrders = [...db.orders].filter(o => o.supplierId === supplierId).sort((a,b)=>b.date.localeCompare(a.date));
    for(const o of supOrders){
      if(Array.isArray(o.items)){
        const match = o.items.find(it =>
          (it.product||'').trim().toLowerCase() === clean ||
          (it.code && it.code.trim().toLowerCase() === clean) ||
          (it.ean && it.ean.trim().toLowerCase() === clean) ||
          (it.supplierName && it.supplierName.trim().toLowerCase() === clean)
        );
        if(match){
          return {
            product: match.product,
            category: match.category || '',
            supplierName: match.supplierName || '',
            code: match.code || '',
            ean: match.ean || '',
            colour: match.colour || '',
            cost: (match.cost != null && Number(match.cost) >= 0) ? Number(match.cost) : null,
            supplierId: o.supplierId,
            source: 'supplier-order'
          };
        }
      }
    }

    // Check supplier catalog
    const cat = db.supplierCatalogs[supplierId] || [];
    const catMatch = cat.find(c =>
      (c.product||'').trim().toLowerCase() === clean ||
      (c.code && c.code.trim().toLowerCase() === clean) ||
      (c.ean && c.ean.trim().toLowerCase() === clean) ||
      (c.supplierName && c.supplierName.trim().toLowerCase() === clean)
    );
    if(catMatch){
      return {
        product: catMatch.product,
        category: catMatch.category || '',
        supplierName: catMatch.supplierName || '',
        code: catMatch.code || '',
        ean: catMatch.ean || '',
        colour: catMatch.colour || '',
        cost: (catMatch.price != null && Number(catMatch.price) >= 0) ? Number(catMatch.price) : null,
        supplierId: supplierId,
        source: 'supplier-catalog'
      };
    }
  }

  // 2. Search recent orders across ALL suppliers (newest orders first)
  const allOrders = [...db.orders].sort((a,b)=>b.date.localeCompare(a.date));
  for(const o of allOrders){
    if(Array.isArray(o.items)){
      const match = o.items.find(it =>
        (it.product||'').trim().toLowerCase() === clean ||
        (it.code && it.code.trim().toLowerCase() === clean) ||
        (it.ean && it.ean.trim().toLowerCase() === clean) ||
        (it.supplierName && it.supplierName.trim().toLowerCase() === clean)
      );
      if(match){
        return {
          product: match.product,
          category: match.category || '',
          supplierName: match.supplierName || '',
          code: match.code || '',
          ean: match.ean || '',
          colour: match.colour || '',
          cost: (match.cost != null && Number(match.cost) >= 0) ? Number(match.cost) : null,
          supplierId: o.supplierId,
          source: 'other-order'
        };
      }
    }
  }

  // 3. Search db.products
  const prod = db.products.find(p => (p.name||'').trim().toLowerCase() === clean || (p.code && p.code.trim().toLowerCase() === clean));
  if(prod){
    return {
      product: prod.name,
      category: prod.category || '',
      supplierName: '',
      code: prod.code || '',
      ean: '',
      colour: '',
      cost: null,
      source: 'product-catalog'
    };
  }

  return null;
}

function syncGlobalDatalists(){
  const allProds = new Set();
  const allEans = new Set();
  db.products.forEach(p => {
    if(p.name) allProds.add(p.name.trim());
    if(p.code && /^\d{8,14}$/.test(p.code.trim())) allEans.add(p.code.trim());
  });
  db.orders.forEach(o => (o.items||[]).forEach(it => {
    if(it.product) allProds.add(it.product.trim());
    if(it.ean) allEans.add(it.ean.trim());
    if(it.code && /^\d{8,14}$/.test(it.code.trim())) allEans.add(it.code.trim());
  }));
  Object.values(db.supplierCatalogs||{}).forEach(cat => (cat||[]).forEach(c => {
    if(c.product) allProds.add(c.product.trim());
    if(c.ean) allEans.add(c.ean.trim());
  }));
  (db.stockRequired||[]).forEach(r => {

const CAT_PALETTE = [
  {bg:'#F3E4C8', fg:'#7a5416'}, // amber
  {bg:'#DCE9E9', fg:'#1f4c4e'}, // teal
  {bg:'#F1DCD7', fg:'#7a3327'}, // rust
  {bg:'#DDE6F5', fg:'#2c4a7a'}, // blue
  {bg:'#E8DCF0', fg:'#5b3a7a'}, // purple
  {bg:'#DEEED2', fg:'#3a6b26'}, // green
  {bg:'#F5DCEA', fg:'#7a3a5e'}, // pink
  {bg:'#E6E6E0', fg:'#5c5c53'}  // grey
];
function categoryColour(name){
  const key = (name||'').trim().toLowerCase();
  if(!key) return CAT_PALETTE[7];
  if(db.categoryColours[key]!=null && CAT_PALETTE[db.categoryColours[key]]) return CAT_PALETTE[db.categoryColours[key]];
  let h=0; for(let i=0;i<key.length;i++) h = (h*31 + key.charCodeAt(i))>>>0;
  return CAT_PALETTE[h % (CAT_PALETTE.length-1)];
}
function catBadge(name){
  const c = categoryColour(name);
  return `<span class="catbadge" style="background:${c.bg};color:${c.fg}">${escapeHtml(name||'—')}</span>`;
}
function allKnownCategories(){
  const set = new Set(db.categories.map(c=>c.trim()).filter(Boolean));
  db.orders.forEach(o=>o.items.forEach(it=>{ if(it.category) set.add(it.category.trim()); }));
  return [...set].sort((a,b)=>a.localeCompare(b));
}

/* =========================================================
   GROUP-BY-CATEGORY (stable, keeps manual order; groups by
   first-seen order of each category)
========================================================= */
function groupByCategory(items){
  const order = [];
  const map = {};
  items.forEach((item, idx) => {
    const cat = (item.category||'Uncategorised').trim() || 'Uncategorised';
    if(!map[cat]){ map[cat] = []; order.push(cat); }
    map[cat].push({ item, idx });
  });
  return order.map(cat => ({ category: cat, rows: map[cat] }));
}

/* =========================================================
   SCROLL & FOCUS PRESERVATION ACROSS RENDERS
========================================================= */
function captureScrollPositions(){
  const map = {
    _window_y: window.scrollY || document.documentElement.scrollTop || 0,
    _window_x: window.scrollX || document.documentElement.scrollLeft || 0
  };
  document.querySelectorAll('.table-wrap, .md-list, .nav-suppliers, [id^="md-list-"]').forEach((el, i) => {
    const key = el.id || (el.className.split(' ')[0] + '-idx-' + i);
    map[key + '_scrollLeft'] = el.scrollLeft;
    map[key + '_scrollTop'] = el.scrollTop;
  });
  return map;
}

function restoreScrollPositions(map){
  if(!map) return;
  if(typeof map._window_y === 'number'){
    window.scrollTo({ top: map._window_y, left: map._window_x || 0, behavior: 'instant' });
  }
  document.querySelectorAll('.table-wrap, .md-list, .nav-suppliers, [id^="md-list-"]').forEach((el, i) => {
    const key = el.id || (el.className.split(' ')[0] + '-idx-' + i);
    if(typeof map[key + '_scrollLeft'] === 'number'){
      el.scrollLeft = map[key + '_scrollLeft'];
    }
    if(typeof map[key + '_scrollTop'] === 'number'){
      el.scrollTop = map[key + '_scrollTop'];
    }
  });
}

/* =========================================================
   SUPPLIER FINANCIAL STATEMENTS & ORDER TRACKING ENGINE
   Weekly, Monthly, All-time calculations, Paid vs Balance Owed,
   Previous Due / Opening Balances, Payments Ledger & Approval Statuses
========================================================= */
function computeSupplierFinancials(supId, period = 'all', fromDate = '', toDate = ''){
  const sup = (db.suppliers || []).find(s => s.id === supId);
  const now = new Date();
  let startDate = null;
  let endDate = null;

  if(period === 'week'){
    const day = now.getDay();
    const diffToMonday = (day === 0 ? -6 : 1) - day;
    const monday = new Date(now);
    monday.setDate(now.getDate() + diffToMonday);
    startDate = monday.toISOString().split('T')[0];
    endDate = now.toISOString().split('T')[0];
  } else if(period === 'month'){
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    startDate = `${y}-${m}-01`;
    endDate = now.toISOString().split('T')[0];
  } else if(period === '30days'){
    const past30 = new Date(now);
    past30.setDate(now.getDate() - 30);
    startDate = past30.toISOString().split('T')[0];
    endDate = now.toISOString().split('T')[0];
  } else if(period === 'custom' && (fromDate || toDate)){
    startDate = fromDate || null;
    endDate = toDate || null;
  }

  const isOnline = !!(sup && (sup.noPaymentDue === true || sup.onlineOnly === true));
  const openingBalance = isOnline ? 0 : (Number(sup?.openingBalance) || 0);
  const openingDate = sup?.openingBalanceDate || '';

  let allOrders = (db.orders || []).filter(o => o.supplierId === supId && o.type === 'order');
  let periodOrders = allOrders;
  if(startDate) periodOrders = periodOrders.filter(o => o.date >= startDate);
  if(endDate) periodOrders = periodOrders.filter(o => o.date <= endDate);

  let totalOrdered = 0;
  let doneOrdersValue = 0;
  let pendingOrdersValue = 0;
  let pendingApprovalCount = 0;
  let pendingArrivalCount = 0;
  let deliveredCount = 0;

  periodOrders.forEach(o => {
    const t = orderTotals(o);
    totalOrdered += t.value;

    if(o.pendingApproval === true || o.approvalStatus === 'pending'){
      pendingApprovalCount++;
    }

    const arrStatus = orderArrivalStatus(o);
    if(arrStatus === 'arrived'){
      deliveredCount++;
      doneOrdersValue += t.value;
    } else {
      pendingArrivalCount++;
      pendingOrdersValue += t.value;
    }
  });

  let postOpeningOrdersTotal = 0;
  if (openingDate) {
    const postOpeningOrders = allOrders.filter(o => o.date > openingDate);
    postOpeningOrders.forEach(o => {
      postOpeningOrdersTotal += orderTotals(o).value;
    });
  } else {
    postOpeningOrdersTotal = allOrders.reduce((sum, o) => sum + orderTotals(o).value, 0);
  }

  let directPayments = (db.supplierPayments || []).filter(p => p.supplierId === supId);
  if(period==='all' && openingDate) directPayments=directPayments.filter(p=>p.date>openingDate);
  if(startDate) directPayments = directPayments.filter(p => p.date >= startDate);
  if(endDate) directPayments = directPayments.filter(p => p.date <= endDate);

  let totalPaid = directPayments.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);

  const payableOrders=period==='all'&&openingDate?periodOrders.filter(o=>o.date>openingDate):periodOrders;
  const orderLevelPaid = payableOrders.reduce((sum, o) => {
    if(o.paid) return sum + orderTotals(o).value;
    if(Number(o.paidAmount) > 0) return sum + Number(o.paidAmount);
    return sum;
  }, 0);

  totalPaid += orderLevelPaid;

  if(isOnline){
    totalPaid = totalOrdered;
  }

  const totalDue = isOnline ? totalOrdered : (openingBalance + (period === 'all' ? postOpeningOrdersTotal : totalOrdered));
  const remainingBalance = isOnline ? 0 : Math.max(0, totalDue - totalPaid);

  return {
    supId,
    supplier: sup,
    isOnline,
    period,
    startDate,
    endDate,
    openingBalance,
    openingBalanceDate: sup?.openingBalanceDate || '',
    openingBalanceNote: sup?.openingBalanceNote || '',
    orderCount: periodOrders.length,
    allOrderCount: allOrders.length,
    totalOrdered,
    doneOrdersValue,
    pendingOrdersValue,
    postOpeningOrdersTotal,
    totalDue,
    totalPaid,
    remainingBalance,
    pendingApprovalCount,
    pendingArrivalCount,
    deliveredCount
  };
}

/* =========================================================
   PRICE COMPARISON INTELLIGENCE STUDIO (v2.0)
   Real-time Category & Supplier Price Comparison Engine
========================================================= */

// Keyword mapping for automatic category detection if not set

/* =========================================================
   PRICE COMPARISON MATRIX (v2.1)
   Built 100% Directly from Stock Overview & Orders Truth
========================================================= */

function getAllCategoriesComparisonMatrix(){
  const catMap = {};

  // Use exact stock rows from aggregateStock()
  const stockRows = aggregateStock();

  // Build supplier price mapping for every stock item from db.orders
  // so we know what each supplier charged for that exact stock item
  const itemSupplierPrices = {};

  (db.orders || []).forEach(o => {
    if(o.type !== 'order') return;
    const sup = (db.suppliers || []).find(s => s.id === o.supplierId)?.name || 'Unknown Supplier';
    (o.items || []).forEach(it => {
      const prodName = (it.product || '').trim();
      if(!prodName) return;
      const colour = (it.colour || '').trim();
      const key = (prodName + '|' + colour).toLowerCase();

      if(!itemSupplierPrices[key]) itemSupplierPrices[key] = {};
      const cost = Number(it.cost) || 0;
      if(cost > 0 || itemSupplierPrices[key][sup] == null){
        itemSupplierPrices[key][sup] = cost > 0 ? cost : (itemSupplierPrices[key][sup] || 0);
      }
    });
  });

  stockRows.forEach(row => {
    const cat = (row.category || 'Uncategorised').trim() || 'Uncategorised';
    if(!catMap[cat]){
      catMap[cat] = {
        category: cat,
        suppliers: new Set(),
        products: []
      };
    }

    const key = (row.product + '|' + (row.colour || '')).toLowerCase();
    const supPrices = itemSupplierPrices[key] || {};

    // Add suppliers who supplied this item
    row.suppliers.forEach(s => {
      if(s && s !== '—') catMap[cat].suppliers.add(s);
    });
    Object.keys(supPrices).forEach(s => {
      if(s && s !== '—') catMap[cat].suppliers.add(s);
    });

    catMap[cat].products.push({
      name: row.product,
      category: cat,
      colour: row.colour || '',
      codes: Array.from(row.codes || []),
      eans: Array.from(row.eans || []),
      code: Array.from(row.codes || [])[0] || '',
      ean: Array.from(row.eans || [])[0] || '',
      suppliers: Array.from(row.suppliers || []),
      lastCost: row.lastNonZeroCost || row.lastCost || 0,
      prices: supPrices
    });
  });

  // Also include custom quotes if added by user
  if(db.priceQuotes && Array.isArray(db.priceQuotes)){
    db.priceQuotes.forEach(q => {
      const cost = Number(q.cost) || 0;
      if(!q.product || !q.product.trim() || cost <= 0) return;
      const cat = (q.category || 'Uncategorised').trim() || 'Uncategorised';
      const sup = (db.suppliers || []).find(s => s.id === q.supplierId)?.name || q.supplierName || 'Quote';
      const prodName = q.product.trim();

      if(!catMap[cat]){
        catMap[cat] = { category: cat, suppliers: new Set(), products: [] };
      }
      catMap[cat].suppliers.add(sup);

      const existing = catMap[cat].products.find(p => p.name.toLowerCase() === prodName.toLowerCase());
      if(existing){
        existing.prices[sup] = cost;
      } else {
        const newP = {
          name: prodName,
          category: cat,
          colour: '',
          codes: q.code ? [q.code] : [],
          eans: q.ean ? [q.ean] : [],
          code: q.code || '',
          ean: q.ean || '',
          suppliers: [sup],
          lastCost: cost,
          prices: { [sup]: cost }
        };
        catMap[cat].products.push(newP);
      }
    });
  }

  return catMap;
}

function getCategoryIcon(catName){
  const lower = (catName || '').toLowerCase();
  if(lower.includes('defender') || lower.includes('3 in 1')) return '🛡️';
  if(lower.includes('shockproof')) return '⚡';
  if(lower.includes('adapter') || lower.includes('plug')) return '🔌';
  if(lower.includes('lcd') || lower.includes('screen') || lower.includes('display')) return '📱';
  if(lower.includes('wallet')) return '👛';
  if(lower.includes('charger')) return '⚡';
  if(lower.includes('cable') || lower.includes('lead')) return '🔗';
  if(lower.includes('battery')) return '🔋';
  if(lower.includes('power bank')) return '🔋';
  if(lower.includes('transmitter') || lower.includes('fm')) return '📻';
  if(lower.includes('glass') || lower.includes('tempered')) return '🔲';
  if(lower.includes('earphone') || lower.includes('headphone')) return '🎧';
  if(lower.includes('holder')) return '🚗';
  if(lower.includes('digitizer')) return '📟';
  if(lower.includes('camera')) return '📷';
  if(lower.includes('port')) return '🔌';
  if(lower.includes('usb') || lower.includes('sd') || lower.includes('disk') || lower.includes('card')) return '💾';
  if(lower.includes('phone')) return '📱';
  if(lower.includes('crystal shield')) return '💎';
  if(lower.includes('jbl')) return '🔊';
  if(lower.includes('gorilla')) return '🦍';
  return '📦';
}

function renderCategoryMatrixTable(catObj, searchFilter){
  const catName = catObj.category;
  const suppliers = Array.from(catObj.suppliers).sort();
  let products = [...catObj.products].sort((a,b) => a.name.localeCompare(b.name));

  if(searchFilter){
    products = products.filter(p => {
      return p.name.toLowerCase().includes(searchFilter) ||
             (p.colour && p.colour.toLowerCase().includes(searchFilter)) ||
             (p.code && p.code.toLowerCase().includes(searchFilter)) ||
             (p.ean && p.ean.includes(searchFilter));
    });
  }

  // Calculate summary stats for this category
  let catMinPrice = Infinity;
  let catMaxPrice = -Infinity;
  let catCheapestSupplier = '';

  products.forEach(p => {
    suppliers.forEach(s => {
      const price = p.prices[s] != null ? p.prices[s] : (p.suppliers.includes(s) ? p.lastCost : null);
      if(price != null && price > 0){
        if(price < catMinPrice){
          catMinPrice = price;
          catCheapestSupplier = s;
        }
        if(price > catMaxPrice){
          catMaxPrice = price;
        }
      }
    });
  });

  const hasMultipleSuppliers = suppliers.length > 1;

  return `
    <div class="comp-cat-section" id="cat-sec-${escapeHtml(catName.replace(/\s+/g,'-'))}">
      <div class="comp-cat-header-bar">
        <div class="comp-cat-title-wrap">
          <span style="font-size:22px;">${getCategoryIcon(catName)}</span>
          <h3>${escapeHtml(catName)}</h3>
          <span class="comp-badge-sup-count">${suppliers.length} Supplier${suppliers.length>1?'s':''}</span>
          <span class="comp-badge-prod-count">${products.length} Product${products.length>1?'s':''}</span>
        </div>
        <div style="font-size:12.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          ${catMinPrice < Infinity ? `
            <span>Price Range: <strong class="mono">${catMinPrice === catMaxPrice ? fmtMoney(catMinPrice) : fmtMoney(catMinPrice) + ' – ' + fmtMoney(catMaxPrice)}</strong></span>
            ${hasMultipleSuppliers && catCheapestSupplier ? `
              <span class="tag-best-winner">🏆 Lowest in Category: ${escapeHtml(catCheapestSupplier)} (${fmtMoney(catMinPrice)})</span>
            ` : ''}
          ` : '<span class="muted">No price recorded</span>'}
        </div>
      </div>

      <div class="table-wrap" style="max-height:600px;overflow-y:auto;">
        <table class="comp-matrix-table">
          <thead>
            <tr>
              <th style="min-width:260px;">Product Name / Model</th>
              ${suppliers.map(s => `
                <th class="th-supplier">
                  <div style="font-size:13.5px;">${escapeHtml(s)}</div>
                  <div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-weight:400;">Unit Cost (€)</div>
                </th>
              `).join('')}
              <th class="th-best">🏆 Lowest Price / Verdict</th>
            </tr>
          </thead>
          <tbody>
            ${products.length === 0 ? '<tr><td colspan="'+(suppliers.length+2)+'" class="muted" style="text-align:center;padding:20px;">No matching products</td></tr>' : ''}
            ${products.map(p => {
              const priceEntries = [];
              suppliers.forEach(s => {
                let price = p.prices[s];
                if(price == null && p.suppliers.includes(s)){
                  price = p.lastCost;
                }
                if(price != null && price > 0){
                  priceEntries.push({ supplier: s, price: price });
                }
              });

              let minItemPrice = Infinity;
              let maxItemPrice = -Infinity;
              let cheapestSup = '';

              priceEntries.forEach(e => {
                if(e.price < minItemPrice){ minItemPrice = e.price; cheapestSup = e.supplier; }
                if(e.price > maxItemPrice){ maxItemPrice = e.price; }
              });

              return `
                <tr>
                  <td class="td-product">
                    <div class="comp-prod-title">
                      ${escapeHtml(p.name)}
                      ${p.colour ? `<span style="font-weight:400;color:var(--ink-soft);margin-left:4px;">(${escapeHtml(p.colour)})</span>` : ''}
                    </div>
                    <div class="comp-prod-meta">
                      ${p.code ? `<span>Code: ${escapeHtml(p.code)}</span>` : ''}
                      ${p.ean ? `<span style="margin-left:6px;">EAN: ${escapeHtml(p.ean)}</span>` : ''}
                    </div>
                  </td>
                  ${suppliers.map(s => {
                    let price = p.prices[s];
                    if(price == null && p.suppliers.includes(s)){
                      price = p.lastCost;
                    }

                    if(price == null) return '<td class="td-price empty">&mdash;</td>';
                    if(price === 0) return '<td class="td-price empty" title="Zero cost recorded">&euro;0.00</td>';

                    const isCheapest = priceEntries.length > 1 && price <= minItemPrice;
                    const isHigher = priceEntries.length > 1 && price >= maxItemPrice && price > minItemPrice;

                    let tdClass = 'td-price';
                    if(isCheapest) tdClass += ' is-cheapest';
                    else if(isHigher) tdClass += ' is-higher';

                    return `
                      <td class="${tdClass}">
                        ${fmtMoney(price)}
                        ${isCheapest ? ' <span style="font-size:10px;">🏆</span>' : ''}
                      </td>
                    `;
                  }).join('')}
                  <td class="td-best-col">
                    ${priceEntries.length > 1 ? `
                      ${minItemPrice < maxItemPrice ? `
                        <span class="tag-best-winner">
                          🏆 ${escapeHtml(cheapestSup)} (${fmtMoney(minItemPrice)})
                        </span>
                        <div style="font-size:10px;color:var(--accent);margin-top:2px;">
                          Save ${fmtMoney(maxItemPrice - minItemPrice)} (${(((maxItemPrice - minItemPrice)/maxItemPrice)*100).toFixed(0)}%)
                        </div>
                      ` : `
                        <span class="tag-equal-price">Equal (${fmtMoney(minItemPrice)})</span>
                      `}
                    ` : (priceEntries.length === 1 ? `
                      <span class="tag-single-source">${escapeHtml(priceEntries[0].supplier)}: ${fmtMoney(priceEntries[0].price)}</span>
                    ` : '<span class="muted">&mdash;</span>')}
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>

      <div class="comp-cat-summary-strip">
        <div>Suppliers in ${escapeHtml(catName)}: <strong>${suppliers.join(', ')}</strong></div>
        <div>${products.length} product${products.length>1?'s':''} listed in table</div>
      </div>
    </div>
  `;
}

/* Export Category Matrix to Excel */
function exportPriceComparisonXlsx(){
  const catMap = getAllCategoriesComparisonMatrix();
  const rows = [];

  rows.push(['Category', 'Product Name', 'Colour', 'Supplier', 'Unit Price (€)', 'Code/SKU', 'EAN']);

  Object.keys(catMap).forEach(catName => {
    const cat = catMap[catName];
    const sups = Array.from(cat.suppliers);
    cat.products.forEach(p => {
      sups.forEach(s => {
        let price = p.prices[s];
        if(price == null && p.suppliers.includes(s)) price = p.lastCost;
        if(price != null && price > 0){
          rows.push([
            catName,
            p.name,
            p.colour || '',
            s,
            price.toFixed(2),
            p.code || '',
            p.ean || ''
          ]);
        }
      });
    });
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Price Comparison Matrix');
  XLSX.writeFile(wb, 'Supplier_Price_Comparison.xlsx');
  toast('✓ Exported Matrix (.xlsx)');
}

function viewHome(){
  const q = (state.homeSearch||'').trim().toLowerCase();
  const homePeriod = state.homeFinancialPeriod || 'all';
  const homeCustomFrom = state.homeDateFrom || '';
  const homeCustomTo = state.homeDateTo || '';

  // Compute metrics for all suppliers
  let totalAllDone = 0, totalAllOrdered = 0, totalAllPendingValue = 0, totalAllPaid = 0, totalAllOrdersCount = 0, totalAllPendingArr = 0, totalAllDeliveredCount = 0;
  const supplierFinList = (db.suppliers || []).map(s => {
    const fin = computeSupplierFinancials(s.id, homePeriod, homeCustomFrom, homeCustomTo);
    totalAllDone += fin.doneOrdersValue;
    totalAllOrdered += fin.totalOrdered;
    totalAllPendingValue += fin.pendingOrdersValue;
    totalAllPaid += fin.totalPaid;
    totalAllOrdersCount += fin.orderCount;
    totalAllPendingArr += fin.pendingArrivalCount;
    totalAllDeliveredCount += fin.deliveredCount;
    return { supplier: s, fin };
  });

  let matchingSuppliers = db.suppliers;
  let matchingOrdersAndProducts = [];

  if(q){
    const matchingSupIds = new Set();

    // Check direct supplier fields
    db.suppliers.forEach(s => {
      const fullText = (s.name + ' ' + (s.notes||'') + ' ' + (s.address||'') + ' ' + (s.phone||'') + ' ' + (s.email||'') + ' ' + (s.contact||'') + ' ' + (s.vat||'')).toLowerCase();
      if(fullText.includes(q)) matchingSupIds.add(s.id);
    });

    // Check products in all orders
    db.orders.forEach(o => {
      o.items.forEach((it) => {
        const itemText = ((it.product||'') + ' ' + (it.code||'') + ' ' + (it.ean||'') + ' ' + (it.supplierName||'') + ' ' + (it.category||'') + ' ' + (it.colour||'') + ' ' + (it.store||'') + ' ' + (o.store||'')).toLowerCase();
        if(itemText.includes(q)){
          matchingSupIds.add(o.supplierId);
          matchingOrdersAndProducts.push({
            supplierId: o.supplierId,
            supplierName: db.suppliers.find(s=>s.id===o.supplierId)?.name || '—',
            orderId: o.id,
            date: o.date,
            type: o.type,
            ref: o.ref || ('#' + o.id.slice(-6)),
            store: it.store || o.store || '—',
            item: it
          });
        }
      });
    });

    // Check supplier catalogs
    Object.keys(db.supplierCatalogs||{}).forEach(supId => {
      (db.supplierCatalogs[supId]||[]).forEach(c => {
        const catText = ((c.product||'') + ' ' + (c.code||'') + ' ' + (c.ean||'') + ' ' + (c.supplierName||'')).toLowerCase();
        if(catText.includes(q)) matchingSupIds.add(supId);
      });
    });

    matchingSuppliers = db.suppliers.filter(s => matchingSupIds.has(s.id));
    matchingOrdersAndProducts.sort((a,b)=> b.date.localeCompare(a.date));
  }

  const cards = matchingSuppliers.map(s => {
    const fin = computeSupplierFinancials(s.id, homePeriod, homeCustomFrom, homeCustomTo);
    return `
      <div class="card supplier-card" data-sup="${s.id}" style="cursor:pointer;position:relative;">

        </div>
      </div>`;
  }).join('');

  return `
    <div class="page-head">
      <div>

        </div>
        <div class="sup-stmt-kpi">
          <div class="sup-stmt-kpi-val" style="color:var(--ink);">${fmtMoney(totalAllOrdered)}</div>

        </div>
        <div class="sup-stmt-kpi" style="${totalAllPendingArr > 0 ? 'background:#fffbf2;border-color:#fce4be;' : ''}">
          <div class="sup-stmt-kpi-val" style="${totalAllPendingArr > 0 ? 'color:var(--amber);' : 'color:var(--ink);'}">${fmtMoney(totalAllPendingValue)}</div>
          <div class="sup-stmt-kpi-lbl">⏳ Invoices Pending Arrival (${totalAllPendingArr})</div>
        </div>
        <div class="sup-stmt-kpi">
          <div class="sup-stmt-kpi-val" style="color:#2F6F72;">${fmtMoney(totalAllPaid)}</div>

          </thead>
          <tbody>
            ${supplierFinList.map(({ supplier: s, fin }) => `
              <tr>
                <td style="font-weight:700;color:var(--ink);">
                  <a href="#" onclick="event.preventDefault();setView('supplier','${s.id}');" style="color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:6px;">

    <div class="grid cols-3">${cards}</div>

/* =========================================================
   SHARED ITEMS TABLE (used for pending lines AND saved orders)
   Grouped by category with a coloured heading row per category.
   Every field is a live-editable input.
========================================================= */
function renderItemsTable(items, opts){
  opts = opts || {};
  const orderId = opts.orderId || null;      // null => pending (unsaved) lines
  const kind = opts.kind || 'order';         // 'order' | 'return' | 'faulty'
  const showArrival = !!opts.showArrival;
  const groups = groupByCategory(items);
  const colCount = 10 + (showArrival?2:0) + 1; // +1 for actions col, +1 for store col
  const wrapId = 'table-wrap-' + (orderId ? 'order-'+orderId : 'pending');

  const fieldFn = orderId ? `updateOrderItemField('${orderId}',` : `updatePendingField(`;
  const moveFn  = orderId ? `moveOrderItem('${orderId}',`      : `movePendingLine(`;
  const removeFn= orderId ? `removeOrderItem('${orderId}',`    : `removePendingLine(`;

  let rowsHtml = '';
  groups.forEach(g => {
    const c = categoryColour(g.category);
    let catQty = 0, catVal = 0;
    g.rows.forEach(({item}) => {
      catQty += Number(item.qty)||0;
      catVal += (Number(item.qty)||0) * (Number(item.cost)||0);
    });
    rowsHtml += `<tr class="cat-header">
      <td colspan="${colCount}" style="background:${c.bg};color:${c.fg};padding:6px 12px;position:sticky;left:0;">
        <div style="position:sticky;left:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;max-width:calc(100vw - 320px);min-width:240px;">
          <span><b>${escapeHtml(g.category)}</b></span>
          <span class="mono" style="font-size:11.5px;font-weight:600;opacity:.95;">Total: ${catQty} unit${catQty===1?'':'s'}${catVal>0?' · '+fmtMoney(catVal):''}</span>
        </div>
      </td>
    </tr>`;
    g.rows.forEach(({item, idx}) => {
      const status = showArrival ? itemArrivalStatus(item) : null;
      const rowOrderKey = orderId || 'pending';
      rowsHtml += `
        <tr>
          <td class="col-cat"><input class="cellinput" data-order="${rowOrderKey}" data-idx="${idx}" data-field="category" value="${escapeHtml(item.category)}" onchange="${fieldFn}${idx},'category',this.value)"></td>
          <td class="col-prod"><input class="cellinput" data-order="${rowOrderKey}" data-idx="${idx}" data-field="product" value="${escapeHtml(item.product)}" onchange="${fieldFn}${idx},'product',this.value)" title="Your name for this product" style="font-weight:600;"></td>
          <td class="num qty-col"><input class="cellinput num qty-input" data-order="${rowOrderKey}" data-idx="${idx}" data-field="qty" type="number" min="0" step="1" value="${item.qty}" onchange="${fieldFn}${idx},'qty',this.value)" title="Quantity"></td>
          <td class="num col-cost"><input class="cellinput num" data-order="${rowOrderKey}" data-idx="${idx}" data-field="cost" type="number" min="0" step="0.01" value="${item.cost}" onchange="${fieldFn}${idx},'cost',this.value)" style="font-weight:600;"></td>
          <td class="num col-total" style="font-weight:600;">${fmtMoney(item.qty*item.cost)}</td>
          ${showArrival ? `
          <td style="min-width:130px;">
            <span class="tag ${status==='adjusted'||status==='adjusted-confirmed'?'adjusted':status}">${
              status==='arrived' ? 'Arrived' :
              status==='adjusted' ? `Received ${item.arrivedQty}/${item.qty} — confirm?` :
              status==='adjusted-confirmed' ? `Received ${item.arrivedQty}/${item.qty} (adjusted)` :
              'Pending'
            }</span>
            ${status==='adjusted' ? `<button class="icon-btn" title="Confirm this quantity is correct" onclick="confirmArrivalAdjustment('${orderId}',${idx})">Confirm</button>` : ''}
          </td>
          <td style="width:36px;"><div class="tick ${(status==='arrived'||status==='adjusted-confirmed')?'checked':''}" data-order="${orderId}" data-item="${idx}" title="Click to record how many arrived">${status==='arrived'||status==='adjusted-confirmed'?'✓':(status==='adjusted'?'~':'')}</div></td>
          ` : ''}
          <td class="col-colour"><input class="cellinput" data-order="${rowOrderKey}" data-idx="${idx}" data-field="colour" value="${escapeHtml(item.colour)}" onchange="${fieldFn}${idx},'colour',this.value)"></td>
          <td class="col-store"><input class="cellinput" data-order="${rowOrderKey}" data-idx="${idx}" data-field="store" list="dl-stores" value="${escapeHtml(item.store||'')}" placeholder="Store (optional)" onchange="${fieldFn}${idx},'store',this.value)" title="Which store this line is for (e.g. Arklow)"></td>
          <td class="col-supname"><input class="cellinput" data-order="${rowOrderKey}" data-idx="${idx}" data-field="supplierName" value="${escapeHtml(item.supplierName||'')}" placeholder="same as yours" onchange="${fieldFn}${idx},'supplierName',this.value)" title="Supplier's own name for this product"></td>
          <td class="col-code"><input class="cellinput mono" data-order="${rowOrderKey}" data-idx="${idx}" data-field="code" value="${escapeHtml(item.code)}" onchange="${fieldFn}${idx},'code',this.value)" title="Code / SKU"></td>
          <td class="col-ean"><input class="cellinput mono" data-order="${rowOrderKey}" data-idx="${idx}" data-field="ean" value="${escapeHtml(item.ean||'')}" onchange="${fieldFn}${idx},'ean',this.value)" title="EAN / barcode"></td>
          <td class="actions-cell col-actions">
            <button class="icon-btn" title="Move up" onclick="${moveFn}${idx},-1)">▲</button>
            <button class="icon-btn" title="Move down" onclick="${moveFn}${idx},1)">▼</button>
            ${(orderId && kind==='order') ? `<button class="icon-btn" title="Return this line" onclick="openReturnModal('${orderId}',${idx})">↩</button>` : ''}
            ${(orderId && kind==='order') ? `<button class="icon-btn" title="Mark this line as faulty" onclick="openFaultyModal('${orderId}',${idx})">⚠</button>` : ''}
            <button class="icon-btn rust-ic" title="Remove line" onclick="${removeFn}${idx})">✕</button>
          </td>
        </tr>`;
    });
  });

  return `
    <div style="display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:4px 10px 4px;">
      <span class="small mono muted" style="font-size:10.5px;font-weight:600;text-transform:uppercase;">↔ Slide Order:</span>
      <button type="button" class="btn ghost sm" style="padding:2px 8px;font-size:11px;font-weight:bold;" onclick="slideTable('${wrapId}', -260)" title="Slide Left">◀ Left</button>
      <button type="button" class="btn ghost sm" style="padding:2px 8px;font-size:11px;font-weight:bold;" onclick="slideTable('${wrapId}', 260)" title="Slide Right">Right ▶</button>
    </div>
    <div class="table-wrap" id="${wrapId}" title="Drag with mouse or use ◀ / ▶ buttons to slide">
      <table class="line-items-table">
        <thead><tr>
          <th class="col-cat">Category</th>
          <th class="col-prod">Product (yours)</th>
          <th class="num qty-col">Qty</th>
          <th class="num col-cost">Cost</th>
          <th class="num col-total">Total</th>
          ${showArrival?'<th style="min-width:130px;">Arrival</th><th style="width:36px;"></th>':''}
          <th class="col-colour">Colour</th>
          <th class="col-store">Store</th>
          <th class="col-supname">Supplier's name</th>
          <th class="col-code">Code</th>
          <th class="col-ean">EAN</th>
          <th class="col-actions"></th>
        </tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="${colCount}" class="muted small" style="padding:14px 10px;">No lines yet.</td></tr>`}</tbody>
      </table>
    </div>
  `;
}

function orderTotals(o){
  let qty=0, value=0;
  o.items.forEach(it => { qty += Number(it.qty); value += Number(it.qty)*Number(it.cost); });
  value += Number(o.deliveryCost)||0;
  return {qty, value:Math.round((value+Number.EPSILON)*100)/100};
}
function itemArrivalStatus(it){
  const arrivedQty = Number(it.arrivedQty||0);
  const qty = Number(it.qty);
  if(arrivedQty<=0) return 'pending';
  if(arrivedQty===qty) return 'arrived';
  return it.arrivalConfirmed ? 'adjusted-confirmed' : 'adjusted';
}

function renderOrderDetailPanel(o){
  const t = orderTotals(o);
  const kind = o.type==='return' ? 'return' : o.type==='faulty' ? 'faulty' : 'order';
  const kindLabel = kind==='return' ? '↩ Return' : kind==='faulty' ? '⚠ Faulty' : 'Order';
  const sup = db.suppliers.find(s=>s.id===o.supplierId);
  const resolved = !!o.resolved;
  const arrStatus = orderArrivalStatus(o);

  return `
    <div class="card">
      <div class="card-head">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <h3 style="margin:0;">${kindLabel}${state.view!=='supplier' && sup ? ' — '+escapeHtml(sup.name) : ''}</h3>
          <input type="date" class="cellinput small" style="width:140px;" value="${o.date}" title="Order date — click to change" onchange="updateOrderDate('${o.id}',this.value)">
          <input class="cellinput mono small" style="width:110px;" value="${escapeHtml(o.ref||('#'+o.id.slice(-6)))}" title="Order/reference number — click to rename" onchange="updateOrderRef('${o.id}',this.value)">
          <input class="cellinput small" style="width:130px;" list="dl-stores" value="${escapeHtml(o.store||'')}" placeholder="Store (optional)" title="Which store this went to" onchange="updateOrderStore('${o.id}',this.value)">

          ${kind==='order' ? `
            <span class="tag ${arrStatus==='arrived'?'arrived':arrStatus==='partial'?'partial':'pending'}" style="font-size:11px;padding:2px 8px;">
              ${arrStatus==='arrived' ? '✓ Arrived / Done' : arrStatus==='partial' ? '⏳ Partially Arrived' : '⏳ Pending Arrival'}
            </span>
          ` : ''}

          ${kind!=='order' ? `<label class="small" style="display:flex;align-items:center;gap:5px;cursor:pointer;"><input type="checkbox" ${resolved?'checked':''} onchange="toggleOrderResolved('${o.id}')"> Sorted</label>` : ''}
        </div>
        <div class="small mono muted" style="display:flex;align-items:center;gap:12px;">
          ${o.items.length} lines · ${t.qty} units · ${fmtMoney(t.value)}${o.deliveryCost?` (incl. ${fmtMoney(o.deliveryCost)} delivery)`:''}
          ${kind==='order' ? `<button class="icon-btn" title="Mark every line in this order as fully arrived" onclick="markOrderAllArrived('${o.id}')">Mark all arrived</button>` : ''}
          <button class="icon-btn" title="Download as an invoice/order PDF" onclick="exportOrderInvoicePDF('${o.id}')">Export</button>
          <button class="icon-btn rust-ic" title="Delete this ${kind}" onclick="deleteOrder('${o.id}')">Delete</button>
        </div>
      </div>
      <div class="card-body" style="padding-bottom:0;display:flex;gap:10px;align-items:center;">
        <input class="cellinput small" style="flex:1;" value="${escapeHtml(o.note||'')}" placeholder="Add a note (e.g. for Maynooth shop)" onchange="updateOrderNote('${o.id}',this.value)">
