function selectOrder(id){
  state.selectedOrder = (state.selectedOrder===id ? null : id);
  render();
}

function orderArrivalStatus(o){
  if(o.type !== 'order') return null;
  let totalQty = 0, arrivedQty = 0;
  o.items.forEach(it => {
    totalQty += Number(it.qty)||0;
    arrivedQty += Number(it.arrivedQty||0);
  });
  if(totalQty <= 0) return 'pending';
  if(arrivedQty >= totalQty) return 'arrived';
  if(arrivedQty > 0) return 'partial';
  return 'pending';
}

function renderOrderListRow(o, kind){
  const sup = db.suppliers.find(s=>s.id===o.supplierId);
  const t = orderTotals(o);
  const active = state.selectedOrder===o.id;
  const icon = kind==='return' ? '↩ ' : kind==='faulty' ? '⚠ ' : '';
  const subParts = [];
  if(state.view!=='supplier' && sup) subParts.push(escapeHtml(sup.name));
  if(o.ref) subParts.push(escapeHtml(o.ref));
  if(o.store) subParts.push(escapeHtml(o.store));
  subParts.push(`${o.items.length} line${o.items.length===1?'':'s'}`);
  if(kind!=='order' && o.resolved) subParts.push('Sorted');

  let statusBadge = '';
  if(kind === 'order'){
    const status = orderArrivalStatus(o);
    if(status === 'arrived'){
      statusBadge = `<span class="tag arrived" style="font-size:10px;padding:1px 6px;">✓ Arrived / Done</span>`;
    } else if(status === 'partial'){
      statusBadge = `<span class="tag partial" style="font-size:10px;padding:1px 6px;">⏳ Partial</span>`;
    } else {
      statusBadge = `<span class="tag pending" style="font-size:10px;padding:1px 6px;">⏳ Pending</span>`;
    }
  } else if(kind === 'return'){
    statusBadge = o.resolved ? `<span class="tag arrived" style="font-size:10px;padding:1px 6px;">✓ Sorted</span>` : `<span class="tag return" style="font-size:10px;padding:1px 6px;">↩ Return</span>`;
  } else if(kind === 'faulty'){
    statusBadge = o.resolved ? `<span class="tag arrived" style="font-size:10px;padding:1px 6px;">✓ Sorted</span>` : `<span class="tag faulty" style="font-size:10px;padding:1px 6px;">⚠ Faulty</span>`;
  }

  return `
    <div class="md-list-row ${active?'active':''}" onclick="selectOrder('${o.id}')">
      <div class="row-top">
        <span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          ${icon}${fmtDate(o.date)}
          ${statusBadge}
        </span>
        <span class="mono">${fmtMoney(t.value)}</span>
      </div>
      <div class="row-sub">${subParts.join(' · ')}</div>
    </div>`;
}

function renderOrderSection(orders, kind, emptyText){
  const listHtml = orders.map(o=>renderOrderListRow(o,kind)).join('') || `<div class="empty small" style="padding:24px 16px;">${emptyText}</div>`;
  const selected = orders.find(o=>o.id===state.selectedOrder);
  const detailHtml = selected ? renderOrderDetailPanel(selected) :
    `<div class="card"><div class="empty"><div class="big">Pick one from the list</div>Click a ${kind==='order'?'order':kind==='return'?'return':'faulty item'} on the left to view or edit it here.</div></div>`;
  return `<div class="md-layout"><div class="md-list" id="md-list-${kind}">${listHtml}</div><div class="md-detail">${detailHtml}</div></div>`;
}

/* ---- pending line items for the order being built (persisted across reloads) ---- */
const PENDING_KEY = 'stockledger_pending_lines_v1';
const PENDING_META_KEY = 'stockledger_pending_meta_v1';

let pendingLines = [];
let pendingOrderMeta = { date: todayStr(), note: '', store: '', deliveryCost: 0 };

function loadPendingState(){
  try{
    const rawLines = localStorage.getItem(PENDING_KEY);
    if(rawLines) pendingLines = JSON.parse(rawLines) || [];
    const rawMeta = localStorage.getItem(PENDING_META_KEY);
    if(rawMeta) pendingOrderMeta = JSON.parse(rawMeta) || { date: todayStr(), note: '', store: '', deliveryCost: 0 };
  }catch(e){}
}
function savePendingState(){
  try{
    localStorage.setItem(PENDING_KEY, JSON.stringify(pendingLines));
    localStorage.setItem(PENDING_META_KEY, JSON.stringify(pendingOrderMeta));
  }catch(e){}
}
loadPendingState();

function addPendingLine(){
  const category = document.getElementById('li-category').value.trim();
  const product = document.getElementById('li-product').value.trim();
  const suppliernameEl = document.getElementById('li-suppliername');
  const supplierName = suppliernameEl ? suppliernameEl.value.trim() : '';
  const storeEl = document.getElementById('li-store');
  const store = storeEl ? storeEl.value.trim() : (pendingOrderMeta.store || '');
  const code = document.getElementById('li-code').value.trim();
  const eanEl = document.getElementById('li-ean');
  const ean = eanEl ? eanEl.value.trim() : '';
  const colour = document.getElementById('li-colour').value.trim();
  const qty = Number(document.getElementById('li-qty').value)||0;
  const cost = Number(document.getElementById('li-cost').value)||0;
  if(!product){ toast('Enter a product name'); return; }
  if(qty<=0){ toast('Quantity must be greater than 0'); return; }
  pendingLines.push({category, product, supplierName, store, code, ean, colour, qty, cost, arrivedQty:0});
  ensureCatalog(category, db.categories);
  ensureCatalog(colour, db.colours);
  if(store) ensureCatalog(store, db.stores);
  ensureProduct(product, category, code);
  learnCatalogEntry(state.supplierId, {product, supplierName, code, ean, cost});
  savePendingState();
  saveDB();
  render();
}
function updatePendingField(idx, field, value){
  const it = pendingLines[idx]; if(!it) return;
  it[field] = (field==='qty'||field==='cost') ? Math.max(0,Number.isFinite(Number(value))?Number(value):0) : value;
  if(field==='category') ensureCatalog(value, db.categories);
  if(field==='colour') ensureCatalog(value, db.colours);
  if(field==='store' && value) ensureCatalog(value, db.stores);
  if(field==='product'){
    ensureProduct(value, it.category, it.code);
    const known = findKnownProductDetails(value, state.supplierId);
    if(known){
      if((Number(it.cost) === 0 || it.cost == null) && known.cost > 0) it.cost = known.cost;
      if(!it.ean && known.ean) it.ean = known.ean;
      if(!it.code && known.code) it.code = known.code;
      if(!it.category && known.category) it.category = known.category;
      if(!it.supplierName && known.supplierName) it.supplierName = known.supplierName;
    }
  }
  savePendingState();
  saveDB(); render();
}
function movePendingLine(idx, dir){
  const j = idx+dir;
  if(j<0 || j>=pendingLines.length) return;
  [pendingLines[idx], pendingLines[j]] = [pendingLines[j], pendingLines[idx]];
  savePendingState();
  render();
}
function removePendingLine(idx){
  pendingLines.splice(idx,1);
  savePendingState();
  render();
}
function saveCurrentOrder(){
  if(pendingLines.length===0) return;
  const date = pendingOrderMeta.date || todayStr();
  const note = pendingOrderMeta.note || '';
  const store = pendingOrderMeta.store || '';
  const deliveryCost = Number(pendingOrderMeta.deliveryCost)||0;
  if(store) ensureCatalog(store, db.stores);
  pendingLines.forEach(l => {
    if(l.store) ensureCatalog(l.store, db.stores);
    learnCatalogEntry(state.supplierId, l);
  });
  db.orders.push({ id: uid(), supplierId: state.supplierId, type:'order', date, note, store, deliveryCost, items: pendingLines.map(l=>({...l})) });
  pendingLines = [];
  pendingOrderMeta = { date: todayStr(), note: '', store: '', deliveryCost: 0 };
  savePendingState();
  saveDB();
  render();
  toast('Order saved');
}
function updateOrderStore(orderId, value){
  const o = db.orders.find(x=>x.id===orderId); if(!o) return;
  o.store = value.trim();
  if(o.store) ensureCatalog(o.store, db.stores);
  saveDB(); render();
}
function updateOrderDeliveryCost(orderId, value){
  const o = db.orders.find(x=>x.id===orderId); if(!o) return;
  o.deliveryCost = Math.max(0, Number(value)||0);
  saveDB(); render();
}
function updateOrderNote(orderId, value){
  const o = db.orders.find(x=>x.id===orderId); if(!o) return;
  o.note = value.trim();
  saveDB(); render();
}

function updateOrderItemField(orderId, idx, field, value){
  const o = db.orders.find(x=>x.id===orderId); if(!o) return;
  const it = o.items[idx]; if(!it) return;
  it[field] = (field==='qty'||field==='cost'||field==='arrivedQty') ? Math.max(0,Number.isFinite(Number(value))?Number(value):0) : value;
  if(field==='qty' && it.arrivedQty>it.qty) it.arrivedQty = it.qty;
  if(field==='category') ensureCatalog(value, db.categories);
  if(field==='colour') ensureCatalog(value, db.colours);
  if(field==='store' && value) ensureCatalog(value, db.stores);
  if(field==='product'){
    ensureProduct(value, it.category, it.code);
    const known = findKnownProductDetails(value, o.supplierId);
    if(known){
      if((Number(it.cost) === 0 || it.cost == null) && known.cost > 0) it.cost = known.cost;
      if(!it.ean && known.ean) it.ean = known.ean;
      if(!it.code && known.code) it.code = known.code;
      if(!it.category && known.category) it.category = known.category;
      if(!it.supplierName && known.supplierName) it.supplierName = known.supplierName;
    }
  }
  if(['product','supplierName','code','ean','cost'].includes(field)) learnCatalogEntry(o.supplierId, it);
  saveDB(); render();
}
function moveOrderItem(orderId, idx, dir){
  const o = db.orders.find(x=>x.id===orderId); if(!o) return;
  const j = idx+dir;
  if(j<0 || j>=o.items.length) return;
  [o.items[idx], o.items[j]] = [o.items[j], o.items[idx]];
  saveDB(); render();
}
function removeOrderItem(orderId, idx){
  const o = db.orders.find(x=>x.id===orderId); if(!o) return;
  if(!confirm('Remove this line from the order?')) return;
  o.items.splice(idx,1);
  saveDB(); render();
  toast('Line removed');
}
function deleteOrder(orderId){
  const o = db.orders.find(x=>x.id===orderId); if(!o) return;
  const kindWord = o.type==='return' ? 'return' : o.type==='faulty' ? 'faulty log' : 'order';
  if(!confirm(`Delete this whole ${kindWord} (${o.items.length} lines)? This cannot be undone.`)) return;
  db.orders = db.orders.filter(x=>x.id!==orderId);
  saveDB(); render();
  toast('Deleted');
}
function updateOrderRef(orderId, value){
  const o = db.orders.find(x=>x.id===orderId); if(!o) return;
  o.ref = value.trim();
  saveDB(); render();
}
function updateOrderDate(orderId, value){
  const o = db.orders.find(x=>x.id===orderId); if(!o) return;
  if(!value) return;
  o.date = value;
  saveDB(); render();
  toast('Date updated');
}
function toggleOrderResolved(orderId){
  const o = db.orders.find(x=>x.id===orderId); if(!o) return;
  o.resolved = !o.resolved;
  saveDB(); render();
  toast(o.resolved ? 'Marked as sorted' : 'Marked as not sorted yet');
}
function markOrderAllArrived(orderId){
  const o = db.orders.find(x=>x.id===orderId); if(!o) return;
  o.items.forEach(it => { it.arrivedQty = it.qty; it.arrivalConfirmed = true; });
  saveDB(); render();
  toast('Whole order marked as arrived — stock updated');
}
function confirmArrivalAdjustment(orderId, idx){
  const o = db.orders.find(x=>x.id===orderId); if(!o) return;
  const it = o.items[idx]; if(!it) return;
  it.arrivalConfirmed = true;
  saveDB(); render();
  toast('Quantity confirmed');
}

function aggregateStock(){
  const map = {};
  db.orders.forEach(o => {
    o.items.forEach(it => {
      const prodName = (it.product || '').trim();
      if(!prodName) return;
      const colour = (it.colour || '').trim();
      const key = (prodName + '|' + colour).toLowerCase();
      if(!map[key]){
        map[key] = {
          __key:key, product:prodName, category:(it.category||'').trim(), colour:colour,
          codes:new Set(), eans:new Set(), suppliers:new Set(), stores:new Set(), costs:new Set(),
          ordered:0, delivered:0, returned:0, faulty:0, value:0,
          lastCost:Number(it.cost)||0, lastNonZeroCost:(Number(it.cost)>0?Number(it.cost):0),
          lastDate:o.date||'', lastNonZeroDate:(Number(it.cost)>0?(o.date||''):''),
          zeroCostCount:0, totalCount:0
        };
      }
      const row = map[key];
      row.totalCount++;
      if(it.category && !row.category) row.category = it.category.trim();
      if(it.code && it.code.trim()) row.codes.add(it.code.trim());
      if(it.ean && it.ean.trim()) row.eans.add(it.ean.trim());

      const sup = db.suppliers.find(s=>s.id===o.supplierId)?.name || '—';
      if(sup) row.suppliers.add(sup);
      const itemStore = (it.store || o.store || '').trim();
      if(itemStore) row.stores.add(itemStore);

      const numCost = Number(it.cost) || 0;
      const numQty = Number(it.qty) || 0;
      const numDelivered = Number(it.arrivedQty || 0);

      if(numCost > 0){
        row.costs.add(numCost);
        if(!row.lastNonZeroDate || (o.date && o.date >= row.lastNonZeroDate)){
          row.lastNonZeroDate = o.date || '';
          row.lastNonZeroCost = numCost;
        }
      } else {
        row.zeroCostCount++;
      }

      if(o.type==='order'){
        row.ordered += numQty;
        row.delivered += numDelivered;
        row.value += numQty * numCost;
      } else if(o.type==='return'){
        row.returned += numQty;
        row.value -= numQty * numCost;
      } else if(o.type==='faulty'){
        row.faulty += numQty;
        row.value -= numQty * numCost;
      }
      if(!row.lastDate || (o.date && o.date >= row.lastDate)){
        row.lastDate = o.date || '';
        row.lastCost = numCost;
      }
    });
  });

  Object.values(map).forEach(r => {
    r.qty = r.delivered - r.returned - r.faulty;
    r.code = [...r.codes].join(', ') || [...r.eans].join(', ') || '—';
    r.ean = [...r.eans].join(', ') || '';
    r.displayCost = r.lastNonZeroCost > 0 ? r.lastNonZeroCost : r.lastCost;
    r.hasZeroCostOrders = r.zeroCostCount > 0 && r.costs.size > 0;
  });
  return Object.values(map);
}

function productPriceHistory(productName){
  const key = (productName||'').trim().toLowerCase();
  const rows = [];
  db.orders.forEach(o => {
    o.items.forEach((it, idx) => {
      if((it.product||'').trim().toLowerCase() === key){
        rows.push({
          date: o.date,
          type: o.type,
          supplier: db.suppliers.find(s=>s.id===o.supplierId)?.name || '—',
          supplierId: o.supplierId,
          orderId: o.id,
          itemIdx: idx,
          ref: o.ref || ('#' + o.id.slice(-6)),
          store: it.store || o.store || '—',
          colour: it.colour || '',
          code: it.code || '',
          ean: it.ean || '',
          qty: it.qty,
          cost: it.cost,
          category: it.category || '',
          supplierName: it.supplierName || '',
          note: it.note || o.note || ''
        });
      }
    });
  });
  rows.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  return rows;
}

function getProductStockInfo(productName){
  if(!productName) return { qty: 0, stores: [] };
  const allStock = aggregateStock();
  const key = productName.trim().toLowerCase();
  const found = allStock.find(r => r.product.trim().toLowerCase() === key);
  if(!found) return { qty: 0, stores: [] };
  return { qty: found.qty, stores: [...found.stores] };
}

function getFilteredStockRequired(){
  let list = db.stockRequired || [];
  const q = (state.reqQuery||'').trim().toLowerCase();
  if(q){
    list = list.filter(r =>
      (r.product + ' ' + (r.category||'') + ' ' + (r.colour||'') + ' ' + (r.code||'') + ' ' + (r.ean||'') + ' ' + (r.store||'') + ' ' + (r.supplierName||'') + ' ' + (r.note||'') + ' ' + (db.suppliers.find(s=>s.id===r.supplierId)?.name||'') + ' ' + (r.supplierCustom||'')).toLowerCase().includes(q)
    );
  }
  if(state.reqStoreFilter){
    list = list.filter(r => (r.store||'') === state.reqStoreFilter);
  }
  if(state.reqSupplierFilter){
    if(state.reqSupplierFilter === '__unassigned__'){
      list = list.filter(r => !r.supplierId && !r.supplierCustom);
    } else {
      list = list.filter(r => r.supplierId === state.reqSupplierFilter || r.supplierCustom === state.reqSupplierFilter);
    }
  }
  if(state.reqCategoryFilter){
    list = list.filter(r => (r.category||'Uncategorised').toLowerCase() === state.reqCategoryFilter.toLowerCase());
  }
  return list;
}

const KNOWN_COLOUR_NAMES = ['Black', 'White', 'Red', 'Blue', 'Pink', 'Rose Gold', 'Clear', 'Green', 'Purple', 'Grey', 'Gold', 'Silver', 'Navy', 'Orange', 'Yellow', 'Titanium', 'Dark Blue', 'Midnight', 'Starlight', 'Cyan', 'Brown'];

function isCaseCategory(cat){
  if(!cat) return false;
  const c = String(cat).toLowerCase();
  return c.includes('shockproof') || c.includes('wallet') || c.includes('case') || c.includes('cover') || c.includes('leather') || c.includes('silicone') || c.includes('gel');
}

function normalizeStockRequiredData(){
  if(!db.stockRequired || db.stockRequired.length === 0) return;
  db.stockRequired.forEach(r => {
    if(r.colors && typeof r.colors === 'object'){
      Object.keys(r.colors).forEach(k => {
        if(!r.colors[k] || Number(r.colors[k]) <= 0){
          delete r.colors[k];
        }
      });
      const colorKeys = Object.keys(r.colors);
      if(colorKeys.length > 0){
        r.qty = Object.values(r.colors).reduce((acc, q) => acc + (Number(q)||0), 0);
      } else {
        r.colors = {};
        if(!r.qty || Number(r.qty) <= 0) r.qty = 1;
      }
    } else {
      r.colors = {};
      if(!r.qty || Number(r.qty) <= 0) r.qty = 1;
    }
  });
}

function getCategoryColorColumns(cat){
  if(!db.categoryColorColumns) db.categoryColorColumns = {};
  const cleanCat = (cat||'Uncategorised').toLowerCase();
  if(db.categoryColorColumns[cleanCat] && Array.isArray(db.categoryColorColumns[cleanCat])){
    const cols = [...db.categoryColorColumns[cleanCat]];
    (db.stockRequired||[]).forEach(r => {
      if((r.category||'Uncategorised').toLowerCase() === cleanCat && r.colors){
        Object.keys(r.colors).forEach(c => {
          if(c && !cols.includes(c)) cols.push(c);
        });
      }
    });
    return cols;
  }
  if(isCaseCategory(cleanCat)){
    db.categoryColorColumns[cleanCat] = ['Black', 'Red', 'Pink', 'Blue', 'Rose Gold', 'Clear', 'White', 'Green', 'Purple'];
    return [...db.categoryColorColumns[cleanCat]];
  }
  db.categoryColorColumns[cleanCat] = [];
  return [];
}

function updateRequiredColorQty(id, color, value){
  if(!db.stockRequired) return;
  const item = db.stockRequired.find(r => r.id === id);
  if(!item) return;
  if(!item.colors) item.colors = {};
  const num = parseInt(value, 10);
  if(!isNaN(num) && num > 0){
    item.colors[color] = num;
  } else {
    delete item.colors[color];
  }
  const colorSum = Object.values(item.colors).reduce((acc, q) => acc + (Number(q)||0), 0);
  item.qty = colorSum > 0 ? colorSum : (item.qty || 1);
  saveDB();
  reRenderPreserveFocus();
}

function addStockRequired(item){
  if(!db.stockRequired) db.stockRequired = [];
  let cleanProd = (item.product||'').trim();
  if(!cleanProd){ toast('Please enter a product name'); return false; }

  const cat = (item.category||'').trim() || 'Uncategorised';
  const store = (item.store||'').trim();
  const supId = (item.supplierId||'').trim() || null;
  const itemColors = item.colors && typeof item.colors === 'object' ? Object.assign({}, item.colors) : {};

  // Clean out any 0 or empty keys from itemColors
  Object.keys(itemColors).forEach(k => {
    if(!itemColors[k] || Number(itemColors[k]) <= 0){
      delete itemColors[k];
    }
  });

  const hasColors = Object.keys(itemColors).length > 0;
  const itemQty = hasColors
    ? Object.values(itemColors).reduce((acc, q) => acc + (Number(q)||0), 0)
    : Math.max(1, parseInt(item.qty, 10) || 1);

  // Check if same model exists in this category
  const existing = db.stockRequired.find(r =>
    (r.category||'Uncategorised').toLowerCase() === cat.toLowerCase() &&
    r.product.toLowerCase() === cleanProd.toLowerCase() &&
    (r.store||'') === store &&
    (r.supplierId||null) === supId
  );

  if(existing){
    if(!existing.colors) existing.colors = {};
    if(hasColors){
      Object.entries(itemColors).forEach(([c, q]) => {
        existing.colors[c] = (Number(existing.colors[c]) || 0) + (Number(q) || 0);
      });
      existing.qty = Object.values(existing.colors).reduce((acc, q) => acc + (Number(q)||0), 0);
    } else {
      existing.qty = (Number(existing.qty) || 0) + itemQty;
    }
    if(item.cost && (!existing.cost || existing.cost === 0)) existing.cost = Number(item.cost);
    if(item.supplierName && !existing.supplierName) existing.supplierName = item.supplierName;
    saveDB();
    render();
    toast(`✓ Updated quantities for "${cleanProd}"`);
    return true;
  }

  const newItem = {
    id: uid(),
    createdAt: todayStr(),
    category: cat,
    product: cleanProd,
    store: store,
    supplierId: supId,
    supplierCustom: (item.supplierCustom||'').trim(),
    supplierName: (item.supplierName||'').trim(),
    cost: (item.cost != null && Number(item.cost) >= 0) ? Number(item.cost) : 0,
    priority: item.priority || 'normal',
    note: (item.note||'').trim(),
    colors: itemColors,
    qty: itemQty
  };

  db.stockRequired.unshift(newItem);
  ensureProduct(newItem.product, newItem.category);
  ensureCatalog(newItem.category, db.categories);
  if(newItem.store) ensureCatalog(newItem.store, db.stores);

  saveDB();
  render();
  toast(`✓ Added "${newItem.product}" (${newItem.qty} units) to Stock Required`);
  return true;
}

function updateRequiredField(id, field, value){
  if(!db.stockRequired) return;
  const item = db.stockRequired.find(r => r.id === id);
  if(!item) return;

  if(field === 'qty') item.qty = Math.max(1, parseInt(value, 10) || 1);
  else if(field === 'cost') item.cost = Math.max(0, parseFloat(value) || 0);
  else if(field === 'priority') item.priority = value;
  else item[field] = String(value).trim();

  // Auto fill supplier name or cost if known from catalog
  if(field === 'product' && item[field]){
    const details = findKnownProductDetails(item[field], item.supplierId);
    if(details){
      if(!item.category && details.category) item.category = details.category;
      if(!item.supplierName && details.supplierName) item.supplierName = details.supplierName;
      if((item.cost == null || item.cost === 0) && details.cost != null) item.cost = details.cost;
      if(!item.supplierId && details.supplierId) item.supplierId = details.supplierId;
    }
  }

  saveDB();
  reRenderPreserveFocus();
}

function transferRequiredToSupplier(itemIds, targetSupId){
  if(!itemIds || itemIds.length === 0){
    toast('No items selected to transfer');
    return;
  }
  if(!targetSupId){
    openSelectSupplierModal(itemIds);
    return;
  }
  const sup = db.suppliers.find(s => s.id === targetSupId);
  if(!sup){ toast('Supplier not found'); return; }

  const itemsToTransfer = db.stockRequired.filter(r => itemIds.includes(r.id));
  if(itemsToTransfer.length === 0){ toast('No matching items found'); return; }

  let linesAddedCount = 0;
  itemsToTransfer.forEach(r => {
    const hasColorBreakdown = r.colors && Object.keys(r.colors).length > 0;
    if(hasColorBreakdown){
      Object.entries(r.colors).forEach(([colName, colQty]) => {
        if(Number(colQty) > 0){
          pendingLines.push({
            category: r.category || '',
            product: r.product,
            supplierName: r.supplierName || r.product,
            store: r.store || '',
            code: '',
            ean: '',
            colour: colName,
            qty: Number(colQty) || 1,
            cost: Number(r.cost) || 0,
            arrivedQty: 0
          });
          linesAddedCount++;
        }
      });
    } else {
      pendingLines.push({
        category: r.category || '',
        product: r.product,
        supplierName: r.supplierName || r.product,
        store: r.store || '',
        code: '',
        ean: '',
        colour: '',
        qty: Number(r.qty) || 1,
        cost: Number(r.cost) || 0,
        arrivedQty: 0
      });
      linesAddedCount++;
    }
  });

  db.stockRequired = db.stockRequired.filter(r => !itemIds.includes(r.id));
  savePendingState();
  saveDB();
  state.reqSelected.clear();
  setView('supplier', targetSupId);
  toast(`✓ Added ${linesAddedCount} line(s) to ${sup.name} order draft!`);
}

function copyStockRequiredText(items){
  if(!items || items.length === 0){ toast('No items to copy'); return; }
  let txt = `🛒 STOCK REQUIRED (${new Date().toLocaleDateString()})\n`;
  txt += `----------------------------------------\n`;
  let totalUnits = 0, totalVal = 0, lineIdx = 1;
  items.forEach((r) => {
    const sup = db.suppliers.find(s=>s.id===r.supplierId)?.name || r.supplierCustom || '';
    const storeInfo = r.store ? ` [Store: ${r.store}]` : '';
    const supNameInfo = r.supplierName ? ` (SKU: ${r.supplierName})` : '';
    const supInfo = sup ? ` - Supplier: ${sup}` : '';
    const prio = r.priority === 'urgent' ? ' [URGENT 🔴]' : '';

    if(r.colors && Object.keys(r.colors).length > 0){
      const colorEntries = Object.entries(r.colors).filter(([_, q]) => Number(q) > 0);
      if(colorEntries.length > 0){
        colorEntries.forEach(([col, q]) => {
          totalUnits += Number(q)||0;
          totalVal += (Number(q)||0) * (Number(r.cost)||0);
          txt += `${lineIdx++}. ${q}x ${r.product} (${col})${supNameInfo}${storeInfo}${supInfo}${prio}\n`;
        });
        return;
      }
    }
    const q = Number(r.qty)||1;
    totalUnits += q;
    totalVal += q * (Number(r.cost)||0);
    txt += `${lineIdx++}. ${q}x ${r.product}${supNameInfo}${storeInfo}${supInfo}${prio}\n`;
  });
  txt += `----------------------------------------\n`;
  txt += `Total items: ${items.length} · Total units: ${totalUnits}${totalVal > 0 ? ' · Est. value: ' + fmtMoney(totalVal) : ''}\n`;

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(() => {
      toast('✓ Copied formatted stock list to clipboard!');
    }).catch(() => {
      prompt('Copy your stock required list below:', txt);
    });
  } else {
    prompt('Copy your stock required list below:', txt);
  }
}

/* =========================================================
   VIEW: RETURNS
========================================================= */
function viewReturns(){
  let returns = db.orders.filter(o=>o.type==='return').sort((a,b)=>b.date.localeCompare(a.date));
  let faulty = db.orders.filter(o=>o.type==='faulty').sort((a,b)=>b.date.localeCompare(a.date));
  const unsortedCount = [...returns, ...faulty].filter(o=>!o.resolved).length;
  if(state.hideSorted){ returns = returns.filter(o=>!o.resolved); faulty = faulty.filter(o=>!o.resolved); }
  return `
    <div class="page-head">
      <div>
        <div class="eyebrow">Across all suppliers</div>
        <h1>Returns &amp; Faulty</h1>
        <div class="small muted mono">${unsortedCount} not sorted yet</div>
      </div>
      <div class="actions">
        <label class="small" style="display:flex;align-items:center;gap:6px;align-self:center;"><input type="checkbox" id="chk-hide-sorted" ${state.hideSorted?'checked':''}> Hide sorted</label>
        <button class="btn ghost" id="btn-new-faulty">+ New faulty item</button>
        <button class="btn" id="btn-new-return">+ New return</button>
      </div>
    </div>
    <div class="card">
      <div class="card-body small muted">Log a return or a faulty item two ways: hit the ↩ or ⚠ button next to any line inside an order's history on a supplier's page, or use the buttons above for one that isn't tied to a specific past order. Tick "Sorted" on an entry once it's been dealt with (refunded, replaced, etc).</div>
    </div>

    <div class="divider-label">Returns — click one to view or edit it</div>
    ${renderOrderSection(returns, 'return', 'No returns to show.')}

    <div class="divider-label">Faulty</div>
    ${renderOrderSection(faulty, 'faulty', 'No faulty items to show.')}
  `;
}

function renameOrMergeCategory(fromCat, toCat){
  const fromLower = fromCat.trim().toLowerCase();
  const toClean = toCat.trim();
  const toLower = toClean.toLowerCase();
  let count = 0;

  // 1. Update orders
  (db.orders||[]).forEach(o => {
    (o.items||[]).forEach(it => {
      if(it.category && it.category.trim().toLowerCase() === fromLower){
        it.category = toClean;
        count++;
      }
    });
  });

  // 2. Update stock required
  (db.stockRequired||[]).forEach(r => {
    if(r.category && r.category.trim().toLowerCase() === fromLower){
      r.category = toClean;
      count++;
    }
  });

  // 3. Update products
  (db.products||[]).forEach(p => {
    if(p.category && p.category.trim().toLowerCase() === fromLower){
      p.category = toClean;
      count++;
    }
  });

  // 4. Update supplier catalogs
  Object.values(db.supplierCatalogs||{}).forEach(catList => {
    (catList||[]).forEach(c => {
      if(c.category && c.category.trim().toLowerCase() === fromLower){
        c.category = toClean;
        count++;
      }
    });
  });

  // 5. Update categories list
  db.categories = (db.categories||[]).filter(c => c.trim().toLowerCase() !== fromLower);
  if(!db.categories.some(c => c.trim().toLowerCase() === toLower)){
    db.categories.push(toClean);
  }

  // 6. Migrate color swatch in palette
  if(db.categoryColours && db.categoryColours[fromLower] != null){
    if(db.categoryColours[toLower] == null){
      db.categoryColours[toLower] = db.categoryColours[fromLower];
    }
    delete db.categoryColours[fromLower];
  }

  // 7. Migrate color columns in Stock Required
  if(db.categoryColoursCol && db.categoryColoursCol[fromCat]){
    if(!db.categoryColoursCol[toClean]){
      db.categoryColoursCol[toClean] = db.categoryColoursCol[fromCat];
    }
    delete db.categoryColoursCol[fromCat];
  }

  // 8. Update active state filters
  if(state.stockCategoryFilter && state.stockCategoryFilter.toLowerCase() === fromLower){
    state.stockCategoryFilter = toClean;
  }
  if(state.reqCategoryFilter && state.reqCategoryFilter.toLowerCase() === fromLower){
    state.reqCategoryFilter = toClean;
  }

  saveDB();
  closeModal();
  render();
  toast(`✓ Renamed/Merged "${fromCat}" into "${toClean}" (${count} item(s) updated)`);
}

function syncProductMissingDetails(productName, reopenModal = false){
  const rows = productPriceHistory(productName);
  let bestCost = 0, bestEan = '', bestCode = '', bestCategory = '', bestStore = '';

  rows.forEach(r => {
    const c = Number(r.cost) || 0;
    if(c > 0 && bestCost === 0) bestCost = c;
    if(!bestEan && r.ean) bestEan = r.ean;
    if(!bestCode && r.code) bestCode = r.code;
    if(!bestCategory && r.category) bestCategory = r.category;
    if(!bestStore && r.store && r.store !== '—') bestStore = r.store;
  });

  if(bestCost === 0 && !bestEan && !bestCode){
    toast('No existing price or EAN found to sync from. Use "Edit & Sync" to set one.');
    return;
  }

  let updatedCount = 0;
  (db.orders || []).forEach(o => {
    (o.items || []).forEach(it => {
      if((it.product || '').trim().toLowerCase() === productName.trim().toLowerCase()){
        let changed = false;
        if((Number(it.cost) === 0 || it.cost == null) && bestCost > 0){
          it.cost = bestCost;
          changed = true;
        }
        if(!it.ean && bestEan){
          it.ean = bestEan;
          changed = true;
        }
        if(!it.code && bestCode){
          it.code = bestCode;
          changed = true;
        }
        if(!it.category && bestCategory){
          it.category = bestCategory;
          changed = true;
        }
        if(changed){
          updatedCount++;
          learnCatalogEntry(o.supplierId, it);
        }
      }
    });
  });

  saveDB();
  render();
  if(reopenModal){
    openPriceHistoryModal(productName);
  }
  toast(`✓ Synced missing prices & EANs across ${updatedCount} order line(s)!`);
}

function renameOrMergeProduct(oldName, updatedData, syncMode = 'fill-missing'){
  const oldLower = (oldName || '').trim().toLowerCase();
  const newName = updatedData.name.trim();
  let count = 0;

  // 1. Update orders
  (db.orders || []).forEach(o => {
    (o.items || []).forEach(it => {
      if((it.product || '').trim().toLowerCase() === oldLower){
        it.product = newName;
        if(updatedData.category) it.category = updatedData.category;

        if(syncMode === 'fill-missing'){
          if((!it.code || !it.code.trim()) && updatedData.code) it.code = updatedData.code;
          if((!it.ean || !it.ean.trim()) && updatedData.ean) it.ean = updatedData.ean;
          if((Number(it.cost) === 0 || it.cost == null) && Number(updatedData.cost) > 0) it.cost = Number(updatedData.cost);
          if((!it.store || !it.store.trim()) && updatedData.store) it.store = updatedData.store;
        } else if(syncMode === 'overwrite-all'){
          if(updatedData.code !== undefined) it.code = updatedData.code;
          if(updatedData.ean !== undefined) it.ean = updatedData.ean;
          if(Number(updatedData.cost) >= 0) it.cost = Number(updatedData.cost);
          if(updatedData.store) it.store = updatedData.store;
        }

        learnCatalogEntry(o.supplierId, it);
        count++;
      }
    });
  });

  // 2. Update stockRequired
  (db.stockRequired || []).forEach(r => {
    if((r.product || '').trim().toLowerCase() === oldLower){
      r.product = newName;
      if(updatedData.category) r.category = updatedData.category;
      if(updatedData.code && (!r.supplierName || syncMode === 'overwrite-all')){
        r.supplierName = updatedData.code;
      }
    }
  });

  // 3. Update products list
  db.products = (db.products || []).filter(p => (p.name || '').trim().toLowerCase() !== oldLower);
  const existingNew = (db.products || []).find(p => (p.name || '').trim().toLowerCase() === newName.toLowerCase());
  if(!existingNew){
    db.products.push({
      name: newName,
      category: updatedData.category || '',
      code: updatedData.code || ''
    });
  } else {
    if(updatedData.category) existingNew.category = updatedData.category;
    if(updatedData.code) existingNew.code = updatedData.code;
  }

  // 4. Update supplierCatalogs
  Object.values(db.supplierCatalogs || {}).forEach(catList => {
    (catList || []).forEach(c => {
      if((c.product || '').trim().toLowerCase() === oldLower){
        c.product = newName;
        if(updatedData.category) c.category = updatedData.category;
        if(updatedData.code) c.code = updatedData.code;
        if(updatedData.ean) c.ean = updatedData.ean;
        if(syncMode === 'overwrite-all' || (Number(c.price) === 0 && Number(updatedData.cost) > 0)){
          c.price = Number(updatedData.cost);
        }
      }
    });
  });

  // 5. Autocomplete catalogs
  if(updatedData.category) ensureCatalog(updatedData.category, db.categories);
  if(updatedData.store) ensureCatalog(updatedData.store, db.stores);

  saveDB();
  closeModal();
  render();
  toast(`✓ Saved "${newName}" — updated ${count} item(s) across orders`);
}

function searchPastOrderItems(query){
  const q = query.trim().toLowerCase();
  if(q.length<2) return [];
  const results = [];
  db.orders.filter(o=>o.type==='order').forEach(o => {
    o.items.forEach((item, itemIdx) => {
      if(item.product.toLowerCase().includes(q) || (item.supplierName||'').toLowerCase().includes(q) || (item.code||'').toLowerCase().includes(q)){
        results.push({ orderId:o.id, itemIdx, date:o.date, ref:o.ref||('#'+o.id.slice(-6)), supplierId:o.supplierId, item });
      }
    });
  });
  return results.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);
}

      tbody.innerHTML = `<tr><td colspan="${isFaulty?7:6}" class="small muted" style="text-align:center;padding:16px;">No items added yet. Click past orders above or use manual entry below to add items.</td></tr>`;

function openPriceHistoryModal(productName){
  const rows = productPriceHistory(productName);
  const typeLabel = t => t==='return' ? 'Return' : t==='faulty' ? 'Faulty' : 'Order';

  // Calculate statistics
  let totalOrdered = 0, totalDelivered = 0, totalVal = 0;
  let nonZeroCosts = [];
  let knownEans = new Set(), knownCodes = new Set(), knownCategories = new Set();
  let zeroCostRows = 0;

  rows.forEach(r => {
    const q = Number(r.qty) || 0;
    const c = Number(r.cost) || 0;
    if(r.type === 'order'){
      totalOrdered += q;
      totalVal += q * c;
    }
    if(c > 0) nonZeroCosts.push(c);
    else zeroCostRows++;
    if(r.ean && r.ean.trim()) knownEans.add(r.ean.trim());
    if(r.code && r.code.trim()) knownCodes.add(r.code.trim());
    if(r.category && r.category.trim()) knownCategories.add(r.category.trim());
  });

/* =========================================================
   SMART DOCUMENT & INVOICE OCR / PDF IMPORT
   Intelligently parses order screenshots, supplier invoices & PDFs,
   auto-classifies categories & matches known products,
   and presents an interactive review table before saving.
========================================================= */
if(typeof pdfjsLib !== 'undefined'){
  pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('vendor/pdf.worker.min.mjs',location.href).href;
}

async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf, isEvalSupported: false }).promise;
  let lines = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const rows = {};
    content.items.forEach(it => {
      const y = Math.round(it.transform[5]);
      if(!rows[y]) rows[y] = [];
      rows[y].push(it.str);
    });
    const ys = Object.keys(rows).map(Number).sort((a,b)=>b-a);
    ys.forEach(y => lines.push(rows[y].join(' ').replace(/\s+/g,' ').trim()));
  }
  return lines.filter(Boolean);
}

async function extractImageText(file){
  if(typeof Tesseract === 'undefined') throw new Error('OCR reader unavailable');
  const { data } = await Tesseract.recognize(file, 'eng', {workerPath:new URL('vendor/ocr/worker.min.js',location.href).href,corePath:new URL('vendor/ocr/',location.href).href,langPath:new URL('vendor/ocr/lang/',location.href).href,workerBlobURL:false});
  return data.text.split('\n').map(l=>l.trim()).filter(Boolean);
}

function smartCategorizeAndMatchProduct(rawDesc, code = '', ean = ''){
  const desc = (rawDesc || '').trim();
  const lower = desc.toLowerCase();

  // 1. Detect Category by keyword first (most specific to general)
  let detectedCategory = '';
  if(/\b(adapter|adaptor|otg|converter|dongle|audio\s*jack\s*adapter)\b/i.test(lower)){
    detectedCategory = 'Adapters';
  } else if(/\b(power\s*bank|powerbank|portable\s*charger|battery\s*pack)\b/i.test(lower)){
    detectedCategory = 'Power Bank';
  } else if(/\b(car\s*kit|fm\s*trans|transmitter|car\s*charger|car\s*bluetooth|car\s*mount|car\s*holder)\b/i.test(lower)){
    detectedCategory = 'FM Transmitter';
  } else if(/\b(h\/set|headset|headphone|earphone|earphones|earbuds|airpod|airpods|tws|buds|in-ear)\b/i.test(lower)){
    detectedCategory = 'Earphones';
  } else if(/\b(tempered\s*glass|tempered|tg\b|glass|9d|privacy\s*glass|screen\s*protect|lens\s*protect)\b/i.test(lower)){
    detectedCategory = 'Tempered Glass';
  } else if(/\b(lcd|oled|incell|touch\s*screen|screen\s*replac|digitizer)\b/i.test(lower)){
    detectedCategory = 'LCD';
  } else if(/\b(book\s*case|bookcase|wallet|leather\s*flip|book\s*cover|magnetic\s*wallet)\b/i.test(lower)){
    detectedCategory = 'Wallet Cases';
  } else if(/\b(gorilla|shockproof|phone\s*case|silicone\s*cover|gel\s*case|clear\s*case|armor|back\s*cover)\b/i.test(lower)){
    detectedCategory = 'Cases';
  } else if(/\b(type\s*[-]?\s*c|lightning|micro\s*usb|usb\s*[-]?\s*c|cables?|2m|1m|3m|pd\s*cable|braided|charging\s*lead|fast\s*charg\w*)\b/i.test(lower)){
    detectedCategory = 'Cables';
  } else if(/\b(plug|wall\s*charger|fast\s*plug|power\s*adapter|mains\s*charger|20w|30w)\b/i.test(lower)){
    detectedCategory = 'Chargers';
  } else if(/\b(vape|pod|elux|lost\s*mary|crystal|hayati|nic\s*salt|e-liquid)\b/i.test(lower)){
    detectedCategory = 'Vapes';
  }

  // 2. Try finding best matching known product (db.products & supplierCatalogs)
  let bestProdMatch = null;
  const allKnownProds = [];

  (db.products || []).forEach(p => {
    if(p.name) allKnownProds.push({ name: p.name, category: p.category, code: p.code, ean: p.ean });
  });

  if(state.supplierId && db.supplierCatalogs && db.supplierCatalogs[state.supplierId]){
    db.supplierCatalogs[state.supplierId].forEach(c => {
      if(c.product) allKnownProds.push({ name: c.product, category: c.category || '', code: c.code || '', ean: c.ean || '' });
    });
  }

  // Check code/ean match first
  if(code || ean){
    const matchByCode = allKnownProds.find(p => (code && p.code && p.code.toLowerCase() === code.toLowerCase()) || (ean && p.ean && p.ean === ean));
    if(matchByCode) bestProdMatch = matchByCode;
  }

  // Exact name match
  if(!bestProdMatch){
    for(const p of allKnownProds){
      const pLower = p.name.toLowerCase();
      if(lower === pLower){
        bestProdMatch = p;
        break;
      }
    }
  }

  // Full phrase match with category compatibility
  if(!bestProdMatch){
    let candidateMatches = [];
    for(const p of allKnownProds){
      const pLower = p.name.toLowerCase();
      if(pLower.length >= 4 && (lower.includes(pLower) || pLower.includes(lower))){
        candidateMatches.push(p);
      }
    }
    if(candidateMatches.length > 0){
      const catMatched = detectedCategory ? candidateMatches.find(c => c.category && c.category.toLowerCase() === detectedCategory.toLowerCase()) : null;
      bestProdMatch = catMatched || candidateMatches[0];
    }
  }

  let detectedProduct = bestProdMatch ? bestProdMatch.name : desc;
  if(!detectedCategory && bestProdMatch && bestProdMatch.category){
    detectedCategory = bestProdMatch.category;
  }

  // Colour detector
  let detectedColour = '';
  const colourRegex = /\b(black|white|red|blue|pink|purple|green|gold|rose\s*gold|silver|grey|gray|clear|transparent|navy|orange|yellow)\b/i;
  const colMatch = desc.match(colourRegex);
  if(colMatch){
    detectedColour = colMatch[1].replace(/\s+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  // Align with existing category naming/casing in db
  if(detectedCategory){
    const matchCat = (db.categories||[]).find(c => c.toLowerCase() === detectedCategory.toLowerCase());
    if(matchCat) detectedCategory = matchCat;
  }

  return {
    category: detectedCategory,
    product: detectedProduct,
    colour: detectedColour,
    code: bestProdMatch ? (bestProdMatch.code || code) : code,
    ean: bestProdMatch ? (bestProdMatch.ean || ean) : ean
  };
}

function parseInvoiceLines(lines){
  const candidates = [];
  const numTok = `[€$]?\\s*[\\d,]+(?:\\.\\d{1,2})?`;
  const eanTok = /\b\d{8,14}\b/;
  const skuTok = /\b(?:SKU|ITEM|CODE|ART)[:\s]*([A-Z0-9_-]{3,15})\b/i;

  const reFull = new RegExp(`^(.*\\S)\\s+(\\d+)\\s+(${numTok})\\s+(${numTok})$`);
  const reQtyPrice = new RegExp(`^(.*\\S)\\s+(\\d+)\\s*(?:x|@|pcs|units?)?\\s*(${numTok})$`, 'i');
  const rePriceOnly = new RegExp(`^(.*\\S)\\s+(${numTok})$`);
  const reQtyOnly = /^(.*\S)\s+(\d{1,4})$/;

  lines.forEach(line => {
    let clean = line.replace(/^[|*•-]\s*/, '').trim();
    if(clean.length < 3) return;
    if(/^(invoice|tax\s*invoice|receipt|date|page|subtotal|total|vat|balance|amount\s*due|bill\s*to|ship\s*to|description|item\s*name)/i.test(clean)) return;

    let ean = '';
    const eanMatch = clean.match(eanTok);
    if(eanMatch){
      ean = eanMatch[0];
      clean = clean.replace(ean, '').trim();
    }

    let code = '';
    const skuMatch = clean.match(skuTok);
    if(skuMatch){
      code = skuMatch[1];
      clean = clean.replace(skuMatch[0], '').trim();
    }

    let rawProduct = '';
    let qty = 1;
    let cost = 0;

    let m = clean.match(reFull);
    if(m){
      rawProduct = m[1].trim();
      qty = parseInt(m[2], 10) || 1;
      cost = parseNum(m[3]);
    } else if((m = clean.match(reQtyPrice))){
      rawProduct = m[1].trim();
      qty = parseInt(m[2], 10) || 1;
      cost = parseNum(m[3]);
    } else if((m = clean.match(rePriceOnly)) && /\d/.test(m[2]) && parseNum(m[2]) > 0 && !/^[\d\s.,€$-]+$/.test(m[1])){
      rawProduct = m[1].trim();
      qty = 1;
      cost = parseNum(m[2]);
    } else if((m = clean.match(reQtyOnly)) && !/^[\d\s.,€$-]+$/.test(m[1])){
      rawProduct = m[1].trim();
      qty = parseInt(m[2], 10) || 1;
      cost = 0;
    } else {
      rawProduct = clean;
      qty = 1;
      cost = 0;
    }

    if(!rawProduct || /^[\d\s.,€$-]+$/.test(rawProduct)) return;
    if(qty <= 0) qty = 1;

    const smart = smartCategorizeAndMatchProduct(rawProduct, code, ean);

    candidates.push({
      category: smart.category || '',
      product: smart.product || rawProduct,
      supplierName: rawProduct,
      colour: smart.colour || '',
      code: smart.code || code,
      ean: smart.ean || ean,
      qty: qty,
      cost: cost,
      store: state.storeFilter || ''
    });
  });

  return candidates;
}

function parseNum(s){
  return parseFloat(String(s).replace(/[€$\s]/g,'').replace(/,/g,'')) || 0;
}

async function handleDocImport(file, targetOrderId = null){
  const isImage = file.type.startsWith('image/') || /\.(png|jpe?g|webp|heic|bmp|tiff)$/i.test(file.name||'');
  const isPdf = file.type==='application/pdf' || /\.pdf$/i.test(file.name||'');
  if(!isImage && !isPdf){ toast('Please choose a PDF or an image file'); return; }
  if(isPdf && typeof pdfjsLib === 'undefined'){ toast('PDF reader failed to load — check your internet connection and try again'); return; }
  if(isImage && typeof Tesseract === 'undefined'){ toast('Image OCR reader failed to load — check your internet connection and try again'); return; }
  toast(isImage ? '🔍 Scanning image with OCR (this may take a few seconds)…' : '📄 Reading PDF…');
  try{
    const lines = isImage ? await extractImageText(file) : await extractPdfText(file);
    const candidates = parseInvoiceLines(lines);
    if(candidates.length === 0){
      toast("Couldn't automatically extract line items from that file — please add lines manually.");
      return;
    }
    openDocReviewModal(candidates, targetOrderId);
  }catch(e){
    console.warn(e);
    toast(isImage ? 'Could not read image — please try a clearer, higher-contrast photo.' : "Could not read that PDF.");
  }
}

  function readAllChecked(){

    const trs = tbody.querySelectorAll('tr');
    trs.forEach(tr => {
      const chk = tr.querySelector('input[type="checkbox"]');
      if(!chk || !chk.checked) return;
      const cat = tr.querySelector('[id^="docrow-cat-"]')?.value.trim() || '';
      const prod = tr.querySelector('[id^="docrow-product-"]')?.value.trim() || '';
      const supname = tr.querySelector('[id^="docrow-supname-"]')?.value.trim() || '';
      const store = tr.querySelector('[id^="docrow-store-"]')?.value.trim() || '';
      const colour = tr.querySelector('[id^="docrow-colour-"]')?.value.trim() || '';
      const code = tr.querySelector('[id^="docrow-code-"]')?.value.trim() || '';
      const qty = Number(tr.querySelector('[id^="docrow-qty-"]')?.value) || 1;
      const cost = Number(tr.querySelector('[id^="docrow-cost-"]')?.value) || 0;
      if(!prod && !supname) return;
      rows.push({
        category: cat,
        product: prod || supname,
        supplierName: supname || prod,
        store,
        colour,
        code,
        ean: '',
        qty: qty > 0 ? qty : 1,
        cost: cost >= 0 ? cost : 0,
        arrivedQty: 0
      });
    });
    return rows;
  }

  document.getElementById('modal-confirm-doc-order').onclick = () => {
    const rows = readAllChecked();
    if(rows.length === 0){ toast('No checked line items to add'); return; }

    if(activeOrder){
      rows.forEach(r => {
        activeOrder.items.push(r);
        ensureCatalog(r.category, db.categories);
        ensureCatalog(r.colour, db.colours);
        if(r.store) ensureCatalog(r.store, db.stores);
        ensureProduct(r.product, r.category, r.code);
        learnCatalogEntry(activeOrder.supplierId, r);
      });
      saveDB();
      closeModal();
      render();
      toast(`✓ Added ${rows.length} line(s) to Order #${activeOrder.id.slice(-6)}`);
    } else {
      rows.forEach(r => {
        pendingLines.push(r);
        ensureCatalog(r.category, db.categories);
        ensureCatalog(r.colour, db.colours);
        if(r.store) ensureCatalog(r.store, db.stores);
        ensureProduct(r.product, r.category, r.code);
        if(state.supplierId) learnCatalogEntry(state.supplierId, r);
      });
      saveDB();
      closeModal();
      render();
      toast(`✓ Added ${rows.length} line(s) to order draft — review and save order`);
    }
  };

  document.getElementById('modal-confirm-doc-catalog').onclick = () => {
    if(!state.supplierId){ toast('Open a specific supplier first, then import as price list'); return; }
    const rows = readAllChecked();
    if(!db.supplierCatalogs[state.supplierId]) db.supplierCatalogs[state.supplierId] = [];
    const cat = db.supplierCatalogs[state.supplierId];
    rows.forEach(r => {
      const existing = cat.find(c => c.product.toLowerCase() === r.product.toLowerCase());
      if(existing){
        existing.price = r.cost;
        if(r.code) existing.code = r.code;
        if(r.category) existing.category = r.category;
      } else {
        cat.push({ product: r.product, price: r.cost, category: r.category, code: r.code });
      }
    });
    saveDB();
    closeModal();
    render();
    toast(`✓ Saved ${rows.length} item prices into supplier price list`);
  };
}

/* =========================================================
   SUPPLIER PRICE LIST IMPORT (XML / CSV)
   Lets you upload a supplier's own product/price feed so their
   prices auto-fill when you add order lines later.
========================================================= */
function parseCatalogFile(text, isXml){
  const rows = [];
  if(isXml){
    try{
      const doc = new DOMParser().parseFromString(text, 'application/xml');
      if(doc.querySelector('parsererror')) throw new Error('bad xml');
      // guess the repeating item element: whichever tag appears most often
      const counts = {};
      doc.querySelectorAll('*').forEach(el => { counts[el.tagName] = (counts[el.tagName]||0)+1; });
      let itemTag = null, best = 1;
      Object.entries(counts).forEach(([tag,n]) => { if(n>best){ best=n; itemTag=tag; } });
      if(itemTag){
        doc.querySelectorAll(itemTag).forEach(el => {
          const get = (names) => {
            for(const n of names){
              const child = [...el.children].find(c=>c.tagName.toLowerCase()===n);
              if(child && child.textContent.trim()) return child.textContent.trim();
            }
            return '';
          };
          const product = get(['name','title','product','productname','description']);
          const price = parseNum(get(['price','cost','unitprice','wholesale']));
          const ean = get(['ean','barcode','gtin','upc']);
          const code = get(['code','sku','id','ref']);
          if(product) rows.push({ product, price, ean, code });
        });
      }
    }catch(e){ console.warn('xml parse failed', e); }
  } else {
    const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
    lines.forEach(line => {
      const parts = line.split(/\t|,/).map(p=>p.trim());
      if(parts.length<2) return;
      const looksHeader = /name|product|price|sku|ean/i.test(line) && !/\d/.test(parts[parts.length-1]||'');
      if(looksHeader) return;
      const [product, code='', priceRaw='', ean=''] = parts;
      if(!product) return;
      rows.push({ product, code, price: parseNum(priceRaw), ean });
    });
  }
  return rows;
}

async function handleCatalogImport(file){
  if(!state.supplierId){ toast('Open a specific supplier first'); return; }
  const isXml = /\.xml$/i.test(file.name||'') || file.type.includes('xml');
  const text = await file.text();
  const rows = parseCatalogFile(text, isXml);
  if(rows.length===0){ toast("Couldn't find product/price rows in that file"); return; }
  openDocReviewModal(rows.map(r=>({ product:r.product, qty:1, cost:r.price, ean:r.ean })));
}

function exportPDF(title, columns, rows, opts){
  opts = opts || {};
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: opts.orientation || 'landscape' });
  const pageWidth = doc.internal.pageSize.getWidth();
  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text(title, 14, 16);
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text(reportBusinessName() + ' — generated ' + new Date().toLocaleDateString(), 14, 22);
  doc.autoTable({
    head:[columns], body: rows, startY: 28,
    styles:{ fontSize: opts.fontSize || 8, cellPadding: 2, overflow: 'linebreak' },
    headStyles:{ fillColor:[20,32,35] },
    columnStyles: opts.columnStyles || {},
    tableWidth: pageWidth - 20,
    margin: { left: 10, right: 10 }
  });
  doc.save(title.replace(/\s+/g,'_') + '.pdf');
}
function exportXLSX(title, columns, rows){
  const ws = XLSX.utils.aoa_to_sheet([columns, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, title.slice(0,30));
  XLSX.writeFile(wb, title.replace(/\s+/g,'_') + '.xlsx');
}

/* =========================================================
   TABLE SLIDING / HORIZONTAL DRAG SCROLL
========================================================= */
function slideTable(wrapId, delta){
  const el = document.getElementById(wrapId);
  if(el) el.scrollBy({ left: delta, behavior: 'smooth' });
}

function enableDragToScroll(el) {
  if (!el || el.dataset.dragEnabled) return;
  el.dataset.dragEnabled = 'true';
  let isDown = false;
  let startX = 0;
  let scrollLeft = 0;

  el.addEventListener('mousedown', (e) => {
    if (['INPUT', 'BUTTON', 'SELECT', 'A', 'TEXTAREA', 'OPTION'].includes(e.target.tagName)) return;
    if (e.target.classList.contains('tick') || e.target.classList.contains('swatch') || e.target.closest('.actions-cell') || e.target.closest('.icon-btn')) return;
    isDown = true;
    el.classList.add('grabbing');
    startX = e.pageX - el.offsetLeft;
    scrollLeft = el.scrollLeft;
  });

  window.addEventListener('mouseup', () => {
    if(isDown){
      isDown = false;
      el.classList.remove('grabbing');
    }
  });

  el.addEventListener('mouseleave', () => {
    if(isDown){
      isDown = false;
      el.classList.remove('grabbing');
    }
  });

  el.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - el.offsetLeft;
    const walk = (x - startX) * 1.5;
    el.scrollLeft = scrollLeft - walk;
  });
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `stock-ledger-backup-${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('Backup exported');
}
async function importBackup(file){
  try {
    if(file.size>10*1024*1024)throw Error('Backup exceeds 10 MB.');
    const parsed=JSON.parse(await file.text());
    const value=parsed.product==='supplier-stock-manager'&&parsed.format===1?parsed.records:parsed;
    const next=StockSchema.normalise(value);
    if(!confirm('Replace all records with this backup? A copy of current data will download first.'))return;
    exportBackup();const previous=db;storageNeedsRecovery=false;db=next;if(!await saveDB()){db=previous;throw Error('Browser could not save the replacement.');}render();toast('Backup imported');
  } catch(error){toast('Import stopped: '+error.message);}
}

        if(eanEl && details.ean) eanEl.value = details.ean;
        if(costEl && details.cost != null) costEl.value = details.cost;
        toast(`✓ Autofilled ${details.product}: ${details.category ? details.category+' · ' : ''}${details.cost != null ? fmtMoney(details.cost) : ''}`);
      }
    };
    productField.addEventListener('input', doAutofill);
    productField.addEventListener('change', doAutofill);
    productField.addEventListener('blur', doAutofill);
  }

  const codeField = document.getElementById('li-code');
  if(codeField){
    codeField.addEventListener('change', () => {
      const val = codeField.value.trim();
      if(!val) return;
      const prodEl = document.getElementById('li-product');
      if(prodEl && !prodEl.value){
        const details = findKnownProductDetails(val, state.supplierId);
        if(details){
          prodEl.value = details.product;
          const costEl = document.getElementById('li-cost');
          const eanEl = document.getElementById('li-ean');
          const supNameEl = document.getElementById('li-suppliername');
          const catEl = document.getElementById('li-category');
          const colourEl = document.getElementById('li-colour');
          if(catEl && details.category) catEl.value = details.category;
          if(supNameEl && details.supplierName) supNameEl.value = details.supplierName;
          if(colourEl && details.colour) colourEl.value = details.colour;
          if(eanEl && details.ean) eanEl.value = details.ean;
          if(costEl && details.cost != null) costEl.value = details.cost;
          toast(`✓ Found: ${details.product} (${details.category}) — ${details.cost != null ? fmtMoney(details.cost) : ''}`);
        }
      }
    });
  }

  // arrival ticks -> open the "record delivery" modal
  document.querySelectorAll('.tick[data-order]').forEach(el=>{
    el.onclick = () => openReceiveModal(el.dataset.order, Number(el.dataset.item));
  });

  // home search
  const homeSearch = document.getElementById('home-search');
  if(homeSearch){
    homeSearch.oninput = () => { state.homeSearch = homeSearch.value; reRenderPreserveFocus(); };
  }

  // supplier cards -> nav
  document.querySelectorAll('.supplier-card[data-sup]').forEach(el=>{
    el.onclick = () => setView('supplier', el.dataset.sup);
  });
  document.querySelectorAll('.btn-edit-sup').forEach(btn=>{
    btn.onclick = (e) => {
      e.stopPropagation();
      const sup = db.suppliers.find(s=>s.id===btn.dataset.supId);
      if(sup) addSupplierModal(sup);
    };
  });

  // add / edit supplier
  const addSupBtn = document.getElementById('btn-add-supplier');
  if(addSupBtn) addSupBtn.onclick = () => addSupplierModal(null);
  const editSupBtn = document.getElementById('btn-edit-supplier');
  if(editSupBtn) editSupBtn.onclick = () => addSupplierModal(db.suppliers.find(s=>s.id===state.supplierId));
  const editSupBannerBtn = document.getElementById('btn-edit-supplier-banner');
  if(editSupBannerBtn) editSupBannerBtn.onclick = () => addSupplierModal(db.suppliers.find(s=>s.id===state.supplierId));
  const delSupBtn = document.getElementById('btn-delete-supplier');
  if(delSupBtn) delSupBtn.onclick = () => {
    if(!confirm('Delete this supplier and all their order history? This cannot be undone.')) return;
    db.suppliers = db.suppliers.filter(s=>s.id!==state.supplierId);
    db.orders = db.orders.filter(o=>o.supplierId!==state.supplierId);
    saveDB(); setView('home');
    toast('Supplier deleted');
  };
  const expPdf = document.getElementById('btn-export-supplier-pdf');
  if(expPdf) expPdf.onclick = () => exportSupplier('pdf');
  const expXlsx = document.getElementById('btn-export-supplier-xlsx');
  if(expXlsx) expXlsx.onclick = () => exportSupplier('xlsx');

  // stock page
  const stockSearch = document.getElementById('stock-search');
  if(stockSearch){
    stockSearch.oninput = () => { state.stockQuery = stockSearch.value; reRenderPreserveFocus(); };
  }
  document.querySelectorAll('.sortbar button[data-sort]').forEach(btn=>{
    btn.onclick = () => { state.stockSort = btn.dataset.sort; render(); };
  });
  const stExpPdf = document.getElementById('btn-export-stock-pdf');
  if(stExpPdf) stExpPdf.onclick = () => exportStock('pdf');
  const stExpXlsx = document.getElementById('btn-export-stock-xlsx');
  if(stExpXlsx) stExpXlsx.onclick = () => exportStock('xlsx');
  document.querySelectorAll('.swatch[data-cat]').forEach(el=>{
    el.onclick = () => {
      const cat = el.dataset.cat, idx = Number(el.dataset.idx);
      db.categoryColours[cat.toLowerCase()] = idx;
      saveDB(); render();
    };
  });
  document.querySelectorAll('.btn-stock-cat-filter').forEach(btn => {
    btn.onclick = () => {
      state.stockCategoryFilter = btn.dataset.cat || '';
      render();
    };
  });

  // stock required page
  const reqProdInput = document.getElementById('req-add-product');
  if(reqProdInput){
    const doProdLookup = () => {
      const prodVal = reqProdInput.value.trim();
      if(!prodVal) return;
      const details = findKnownProductDetails(prodVal);
      if(details){
        const catEl = document.getElementById('req-add-category');
        const supNameEl = document.getElementById('req-add-supname');
        const costEl = document.getElementById('req-add-cost');
        const supEl = document.getElementById('req-add-supplier');
        if(catEl && details.category && !catEl.value) catEl.value = details.category;
        if(supNameEl && details.supplierName && !supNameEl.value) supNameEl.value = details.supplierName;
        if(costEl && details.cost != null && !costEl.value) costEl.value = details.cost;
        if(supEl && details.supplierId && !supEl.value) supEl.value = details.supplierId;
      }
    };
    reqProdInput.addEventListener('input', doProdLookup);
    reqProdInput.addEventListener('change', doProdLookup);
    reqProdInput.addEventListener('blur', doProdLookup);
  }

  // Category filter pills
  document.querySelectorAll('.btn-req-cat-filter').forEach(btn => {
    btn.onclick = () => {
      state.reqCategoryFilter = btn.dataset.cat || '';
      render();
    };
  });

  // Quick Add form helpers & submit
  const btnQuickFill = document.getElementById('btn-quick-fill-standard');
  if(btnQuickFill){
    btnQuickFill.onclick = () => {
      const qVal = parseInt(document.getElementById('req-quick-fill-qty')?.value, 10) || 30;
      ['Black', 'Red', 'Pink', 'Blue'].forEach(c => {
        const inp = document.querySelector(`.input-quick-add-color[data-color="${c}"]`);
        if(inp) inp.value = qVal;
      });
      toast(`✓ Filled Black, Red, Pink, Blue with ${qVal}`);
    };
  }

  const btnQuickClear = document.getElementById('btn-quick-clear-colors');
  if(btnQuickClear){
    btnQuickClear.onclick = () => {
      document.querySelectorAll('.input-quick-add-color').forEach(inp => inp.value = '');
    };
  }

  const reqForm = document.getElementById('form-stock-required');
  if(reqForm){
    reqForm.onsubmit = (e) => {
      e.preventDefault();
      const product = document.getElementById('req-add-product').value.trim();
      if(!product){ toast('Please enter a product name'); return; }
      const category = document.getElementById('req-add-category').value.trim();
      const qty = parseInt(document.getElementById('req-add-qty').value, 10) || 1;
      const store = document.getElementById('req-add-store').value.trim();
      const supplierId = document.getElementById('req-add-supplier').value.trim();
      const supplierName = document.getElementById('req-add-supname').value.trim();
      const cost = parseFloat(document.getElementById('req-add-cost').value) || 0;
      const priority = document.getElementById('req-add-priority').value;
      const note = document.getElementById('req-add-note').value.trim();

      const colors = {};
      document.querySelectorAll('.input-quick-add-color').forEach(inp => {
        const col = inp.dataset.color;
        const val = parseInt(inp.value, 10);
        if(col && !isNaN(val) && val > 0) colors[col] = val;
      });

      addStockRequired({ product, category, qty, store, supplierId, supplierName, cost, priority, note, colors });
    };
  }

  // Stock Required toolbar actions
  const reqSearch = document.getElementById('req-search');
  if(reqSearch){
    reqSearch.oninput = () => { state.reqQuery = reqSearch.value; reRenderPreserveFocus(); };
  }
  const reqStoreFilter = document.getElementById('req-filter-store');
  if(reqStoreFilter){
    reqStoreFilter.onchange = () => { state.reqStoreFilter = reqStoreFilter.value; render(); };
  }
  const reqSupplierFilter = document.getElementById('req-filter-supplier');
  if(reqSupplierFilter){
    reqSupplierFilter.onchange = () => { state.reqSupplierFilter = reqSupplierFilter.value; render(); };
  }

  const copyReqBtn = document.getElementById('btn-copy-req-list');
  if(copyReqBtn){
    copyReqBtn.onclick = () => copyStockRequiredText(getFilteredStockRequired());
  }
  const exportReqPdfBtn = document.getElementById('btn-export-req-pdf');
  if(exportReqPdfBtn){
    exportReqPdfBtn.onclick = () => exportStockRequired('pdf');
  }
  const exportReqXlsxBtn = document.getElementById('btn-export-req-xlsx');
  if(exportReqXlsxBtn){
    exportReqXlsxBtn.onclick = () => exportStockRequired('xlsx');
  }

  // Stock Required row & category selection & batch actions
  document.querySelectorAll('.chk-req-cat-all').forEach(chkCat => {
    const cat = chkCat.dataset.cat;
    const catItems = (db.stockRequired||[]).filter(r => (r.category||'Uncategorised') === cat);
    const allInCatChecked = catItems.length > 0 && catItems.every(r => state.reqSelected.has(r.id));
    chkCat.checked = allInCatChecked;
    chkCat.onchange = () => {
      if(chkCat.checked){
        catItems.forEach(r => state.reqSelected.add(r.id));
      } else {
        catItems.forEach(r => state.reqSelected.delete(r.id));
      }
      render();
    };
  });

  document.querySelectorAll('.chk-req-row').forEach(chk => {
    chk.onchange = () => {
      const id = chk.dataset.id;
      if(chk.checked) state.reqSelected.add(id);
      else state.reqSelected.delete(id);
      render();
    };
  });

  const btnOrderSelected = document.getElementById('btn-order-selected');
  const btnBatchOrder = document.getElementById('btn-batch-order');
  const handleBatchOrder = () => {
    const selectedIds = [...state.reqSelected];
    if(selectedIds.length === 0){ toast('No items selected'); return; }
    const selectedItems = db.stockRequired.filter(r => selectedIds.includes(r.id));
    const assignedSupIds = [...new Set(selectedItems.map(r => r.supplierId).filter(Boolean))];
    if(assignedSupIds.length === 1){
      transferRequiredToSupplier(selectedIds, assignedSupIds[0]);
    } else {
      openSelectSupplierModal(selectedIds);
    }
  };
  if(btnOrderSelected) btnOrderSelected.onclick = handleBatchOrder;
  if(btnBatchOrder) btnBatchOrder.onclick = handleBatchOrder;

  const btnBatchDelete = document.getElementById('btn-batch-delete');
  if(btnBatchDelete){
    btnBatchDelete.onclick = () => {
      const selectedIds = [...state.reqSelected];
      if(!confirm(`Delete ${selectedIds.length} selected item(s) from Stock Required?`)) return;
      db.stockRequired = db.stockRequired.filter(r => !selectedIds.includes(r.id));
      state.reqSelected.clear();
      saveDB(); render();
      toast(`Deleted ${selectedIds.length} item(s)`);
    };
  }

  // returns page
  const newReturnBtn = document.getElementById('btn-new-return');
  if(newReturnBtn) newReturnBtn.onclick = () => openStandaloneEntryModal('return');
  const newFaultyBtn = document.getElementById('btn-new-faulty');
  if(newFaultyBtn) newFaultyBtn.onclick = () => openStandaloneEntryModal('faulty');
  const hideSortedChk = document.getElementById('chk-hide-sorted');
  if(hideSortedChk) hideSortedChk.onchange = () => { state.hideSorted = hideSortedChk.checked; render(); };
  const storeFilterSel = document.getElementById('store-filter');
  if(storeFilterSel) storeFilterSel.onchange = () => { state.storeFilter = storeFilterSel.value; render(); };

  // backup page
  const businessButton=document.getElementById('save-business-name');
  if(businessButton)businessButton.onclick=()=>{db.businessName=document.getElementById('business-name').value.trim().slice(0,120)||'Supplier Ledger';saveDB();toast('Report name saved');};
  const wipeBtn = document.getElementById('btn-wipe');
  if(wipeBtn) wipeBtn.onclick = () => {
    if(!confirm('Erase ALL data (suppliers, orders, returns, faulty logs, everything)? Export a backup first if unsure.')) return;
    exportBackup();storageNeedsRecovery=false;db = defaultDB(); saveDB(); render(); toast('All data erased; a backup was downloaded');
  };
  const exp2 = document.getElementById('btn-export-json-2');
  if(exp2) exp2.onclick = exportBackup;
  const imp2 = document.getElementById('btn-import-json-2');
  if(imp2) imp2.onclick = () => document.getElementById('file-import').click();
  const changePwBtn = document.getElementById('btn-change-pw');
  if(changePwBtn) changePwBtn.onclick = openChangePasswordModal;
  const rangePdfBtn = document.getElementById('btn-range-export-pdf');
  if(rangePdfBtn) rangePdfBtn.onclick = () => exportOrdersByRange('pdf');
  const rangeXlsxBtn = document.getElementById('btn-range-export-xlsx');
  if(rangeXlsxBtn) rangeXlsxBtn.onclick = () => exportOrdersByRange('xlsx');
  const removePwBtn = document.getElementById('btn-remove-pw');
  if(removePwBtn) removePwBtn.onclick = () => {
    if(!confirm('Turn off the password lock? Anyone who opens this file will get straight in, with no prompt.')) return;
    clearPassword();
    toast('Password lock turned off');
  };






  // Home Period Filter Pills
  document.querySelectorAll('.sup-period-pill[data-home-period]').forEach(btn => {
    btn.onclick = () => {
      state.homeFinancialPeriod = btn.dataset.homePeriod;
      render();
    };
  });

  // Supplier Period Filter Pills
  document.querySelectorAll('.sup-period-pill[data-sup-period]').forEach(btn => {
    btn.onclick = () => {
      state.supplierPeriod = btn.dataset.supPeriod;
      render();
    };
  });

  const btnRecordPay = document.getElementById('btn-record-sup-payment');
  if(btnRecordPay && state.supplierId){
    btnRecordPay.onclick = () => openRecordSupplierPaymentModal(state.supplierId);
  }

  // Price Comparison Toolbar & Filter Events
  const btnTabAll = document.getElementById('btn-tab-filter-all');
  if(btnTabAll){
    btnTabAll.onclick = () => {
      state.compFilterMode = 'all';
      state.compSelectedCat = 'all';
      render();
    };
  }

  const btnTabMulti = document.getElementById('btn-tab-filter-multi');
  if(btnTabMulti){
    btnTabMulti.onclick = () => {
      state.compFilterMode = 'multi';
      state.compSelectedCat = 'all';
      render();
    };
  }

  const catDropdown = document.getElementById('comp-category-dropdown');
  if(catDropdown){
    catDropdown.onchange = () => {
      state.compSelectedCat = catDropdown.value;
      render();
    };
  }

  const compSearchInput = document.getElementById('comp-search-input');
  if(compSearchInput){
    compSearchInput.oninput = () => {
      state.compSearch = compSearchInput.value;
      render();
    };
  }

  const btnResetFilters = document.getElementById('btn-reset-comp-filters');
  if(btnResetFilters){
    btnResetFilters.onclick = () => {
      state.compSearch = '';
      state.compSelectedCat = 'all';
      state.compFilterMode = 'all';
      render();
    };
  }

  const btnAddQuote = document.getElementById('btn-comp-add-quote');
  if(btnAddQuote) btnAddQuote.onclick = openAddPriceQuoteModal;

  const btnExportXlsx = document.getElementById('btn-comp-export-xlsx');
  if(btnExportXlsx) btnExportXlsx.onclick = exportPriceComparisonXlsx;

  // enable smooth mouse drag-to-slide on all tables
  document.querySelectorAll('.table-wrap').forEach(enableDragToScroll);
}

/* =========================================================
   GLOBAL NAV WIRING (sidebar, static across renders)
========================================================= */
document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click', () => setView(el.dataset.view));
});
document.getElementById('sup-nav-list').addEventListener('click', e=>{
  const item = e.target.closest('.sup-nav-item');
  if(item && item.dataset.sup) setView('supplier', item.dataset.sup);
});
document.getElementById('btn-export-json').onclick = exportBackup;
document.getElementById('btn-import-json').onclick = () => document.getElementById('file-import').click();
document.getElementById('file-import').addEventListener('change', e => {
  if(e.target.files[0]) importBackup(e.target.files[0]);
  e.target.value = '';
});

/* initial boot (checks password lock first) */
boot();
</script>
<script src="buyer-phone.js"></script><script>window.BUYER_DATA_ADAPTER={id:"supplier-stock-manager",capture:()=>db,valid:d=>StockSchema.valid(d),restore:async d=>{const next=StockSchema.normalise(d);exportBackup();const previous=db;storageNeedsRecovery=false;db=next;if(!await saveDB()){db=previous;throw Error('Browser could not save the restored records.');}}};</script><script src="buyer-cloud.js"></script><script src="buyer-examples.js"></script><script src="buyer-guide.js"></script></body>
</html>
